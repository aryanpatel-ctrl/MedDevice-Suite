name: Set up bench
description: >
  Turns the checkout into a working bench with scripts/bootstrap.sh, exactly as
  a developer does, and creates a test site with the production app set.
  Expects the job to provide MariaDB on 3306, Redis on 11000 / 13000 and env SITE.

inputs:
  build-assets:
    description: Build the desk's JavaScript and CSS (needed for UI tests)
    default: 'false'

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: '3.14'

    - uses: actions/setup-node@v6
      with:
        node-version: 24

    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('pinned-apps.json', 'apps/meddevice_suite/pyproject.toml') }}
        restore-keys: ${{ runner.os }}-pip-

    - name: Install MariaDB client and bench
      shell: bash
      run: |
        sudo apt-get update && sudo apt-get install -y mariadb-client
        pip install frappe-bench

    - name: Bootstrap the bench
      shell: bash
      run: |
        if [[ "${{ inputs.build-assets }}" == "true" ]]; then
          scripts/bootstrap.sh --dev --skip-redis
        else
          scripts/bootstrap.sh --dev --skip-assets --skip-redis
        fi
        # Redis comes from the job's service containers.
        sed -i '/^redis_/d' Procfile
      env:
        CI: 'Yes'
        PYTHON: python

    - name: Create test site
      shell: bash
      run: scripts/ci/create_test_site.sh
      env:
        CI: 'Yes'
