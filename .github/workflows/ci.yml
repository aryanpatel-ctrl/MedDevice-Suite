name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.number || github.ref }}
  cancel-in-progress: true

env:
  SITE: test.localhost

jobs:
  integrity:
    name: Official apps and traceability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Frappe, ERPNext and India Compliance are exactly the pinned releases
        run: scripts/verify_vendored.sh
      - name: Every implemented requirement is verified by a test
        working-directory: apps/meddevice_suite
        run: python -m meddevice_suite.qa.traceability --check

  server:
    name: Server tests
    needs: integrity
    runs-on: ubuntu-latest

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:11.8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-bench

      - name: Run tests with coverage
        run: |
          mkdir -p reports
          bench --site $SITE run-tests --app meddevice_suite --coverage \
            --junit-xml-output $GITHUB_WORKSPACE/reports/junit.xml

      - name: Coverage gate
        run: |
          ./env/bin/coverage report --data-file=sites/.coverage --rcfile=apps/meddevice_suite/pyproject.toml
          cp sites/coverage.xml reports/coverage.xml

      - name: Traceability gate with test results
        working-directory: apps/meddevice_suite
        run: |
          python -m meddevice_suite.qa.traceability --check \
            --junit ../../reports/junit.xml --output ../../reports/traceability.md
          cat ../../reports/traceability.md >> $GITHUB_STEP_SUMMARY

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-test-evidence
          path: reports/

  ui:
    name: UI tests
    needs: integrity
    runs-on: ubuntu-latest

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:11.8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-bench
        with:
          build-assets: 'true'

      - name: Start bench
        run: scripts/ci/start_bench.sh

      - name: Run UI tests
        run: bench --site $SITE run-ui-tests meddevice_suite --headless --browser electron

      - name: Upload screenshots of failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-screenshots
          path: apps/meddevice_suite/cypress/screenshots/
