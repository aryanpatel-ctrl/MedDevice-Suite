name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# A new push to a pull request replaces its running checks; a run on main always finishes, so
# every commit on main keeps its test, coverage and traceability evidence.
concurrency:
  group: ci-${{ github.event.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SITE: test.localhost

jobs:
  integrity:
    name: Official apps and traceability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Frappe, ERPNext and India Compliance are exactly the pinned releases
        run: scripts/verify_vendored.sh
      - name: Every implemented requirement is verified by a test
        working-directory: apps/meddevice_suite
        run: python -m meddevice_suite.qa.traceability --check

  server:
    name: Server tests
    needs: integrity
    runs-on: ubuntu-latest

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:11.8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - uses: actions/checkout@v6

      # Built assets: the print-view tests render a printout, which needs the desk's bundles.
      - uses: ./.github/actions/setup-bench
        with:
          build-assets: 'true'

      - name: Migrates cleanly
        run: bench --site $SITE migrate

      - name: Run tests with coverage
        run: |
          mkdir -p reports
          bench --site $SITE run-tests --app meddevice_suite --coverage \
            --junit-xml-output $GITHUB_WORKSPACE/reports/junit.xml

      - name: Coverage gate
        run: |
          ./env/bin/coverage report --data-file=sites/.coverage --rcfile=apps/meddevice_suite/pyproject.toml
          cp sites/coverage.xml reports/coverage.xml

      - name: Traceability gate with test results
        working-directory: apps/meddevice_suite
        run: |
          python -m meddevice_suite.qa.traceability --check \
            --junit ../../reports/junit.xml --output ../../reports/traceability.md
          cat ../../reports/traceability.md >> $GITHUB_STEP_SUMMARY

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-test-evidence
          path: reports/

  # The browser tests in parallel shards (scripts/ci/ui_shard.py): as one queue they took nearly
  # three hours. Each shard builds its own bench and site, as the single job did.
  ui-shard:
    name: UI tests (${{ matrix.shard }})
    needs: integrity
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # every shard reports, so one run shows every failure
      matrix:
        shard: [1, 2, 3, 4, 5, 6]

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:11.8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-bench
        with:
          build-assets: 'true'

      - name: Start bench
        run: scripts/ci/start_bench.sh

      - name: Every spec is in exactly one shard
        run: scripts/ci/ui_shard.py --check

      - name: Run this shard's UI tests
        run: |
          specs=$(scripts/ci/ui_shard.py ${{ matrix.shard }})
          echo "Shard ${{ matrix.shard }}: $specs"
          bench --site $SITE run-ui-tests meddevice_suite --headless --browser electron --spec "$specs"

      - name: Upload screenshots of failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-screenshots-${{ matrix.shard }}
          path: apps/meddevice_suite/cypress/screenshots/

  # The one check branch protection and the merge gate read: green only when every shard is.
  ui:
    name: UI tests
    needs: ui-shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every shard passed
        run: |
          echo "shards: ${{ needs.ui-shard.result }}"
          test "${{ needs.ui-shard.result }}" = "success"
