# --- Requirements -----------------------------------------------------------
[[requirement]]
id = "URS-PLT-001"
module = 0
title = "The desk shows only the standard areas, and the entries inside them, that the client requirement uses; every other standard area and entry is hidden for all users, including ones a future release adds."
source = "Scope decisions 2026-10-05 against D1, D2, D3 (module map)"
status = "implemented"

[[requirement]]
id = "URS-PLT-002"
module = 0
title = "Site configuration owned by this app is applied automatically and idempotently on install and on every migrate, without modifying Frappe, ERPNext or India Compliance."
source = "Engineering rules (README)"
status = "implemented"

[[requirement]]
id = "URS-PLT-003"
module = 0
title = "Every implemented requirement is verified by at least one automated test, and the traceability matrix is generated from the source."
source = "ISO 13485 4.1.6 / 21 CFR 11.10(a) software validation"
status = "implemented"

[[requirement]]
id = "URS-PLT-004"
module = 0
title = "Automated tests run on a disposable test site brought to a known state (setup completed with a fixed test company); the preparation refuses to run on a site that does not allow tests."
source = "ISO 13485 4.1.6 / 21 CFR 11.10(a): controlled test environment for software validation"
status = "implemented"

[[requirement]]
id = "URS-PLT-005"
module = 0
title = "Every Frappe module this app declares exists on the site before its DocTypes are synced, and modules the app no longer declares are removed when they hold nothing."
source = "Engineering rules: configuration is code; folder plan 2026-10-05"
status = "implemented"

# --- Module 49: electronic signature (21 CFR Part 11 subpart C) -------------

[[requirement]]
id = "URS-CMP-001"
module = 49
title = "Signing requires the signer to re-enter their own password at the moment of signing; a wrong password records no signature and counts towards the same account lockout as a failed login, and a locked account cannot sign."
source = "21 CFR 11.200(a)(1), 11.300(d); D1 E-sign points"
status = "implemented"

[[requirement]]
id = "URS-CMP-002"
module = 49
title = "Each signature records the signer's user ID and full name, the date and time, the action signed and the meaning of the signature (authored, reviewed, approved, rejected, released or verified), plus an optional reason."
source = "21 CFR 11.50(a); D1, D2 QA Review & Approval (E-Signature)"
status = "implemented"

[[requirement]]
id = "URS-CMP-003"
module = 49
title = "The signatures on a record are shown with the record, on screen and on its printouts, with name, date and time, and meaning."
source = "21 CFR 11.50(b)"
status = "planned"

[[requirement]]
id = "URS-CMP-004"
module = 49
title = "A signature is bound to the exact content of the record at signing and to the previous signature on the same record, so that altering the signed record or any signature is detectable by verification."
source = "21 CFR 11.70"
status = "implemented"

[[requirement]]
id = "URS-CMP-005"
module = 49
title = "Signature records cannot be edited or deleted by any user, including system managers."
source = "21 CFR 11.70, 11.10(e)"
status = "implemented"

[[requirement]]
id = "URS-CMP-006"
module = 49
title = "Only an identified individual can sign: shared and system accounts (Administrator, Guest) are refused, and the signer must hold the permission the signed action requires on the record."
source = "21 CFR 11.100(a), 11.10(d), 11.10(g)"
status = "implemented"

[[requirement]]
id = "URS-CMP-030"
module = 49
title = "A person signs from the record, in a dialog that names the act and the meaning of the signature and asks for their own password; only the acts declared for that record type can be signed, and only by someone who may open the record."
source = "21 CFR 11.50, 11.200; design approved 2026-10-07 (document control)"
status = "planned"

# --- Module 50: tamper-evident audit trail (21 CFR 11.10(e); EU GMP Annex 11 §9) ---

[[requirement]]
id = "URS-CMP-007"
module = 50
title = "Every create, change, submit, cancel, amend, discard, rename and delete of a regulated record, including values that code writes through the record itself (such as a status set on submit), is recorded in the audit trail automatically and exactly once, without any action by the user."
source = "21 CFR 11.10(e); design approved 2026-10-06"
status = "implemented"

[[requirement]]
id = "URS-CMP-008"
module = 50
title = "Each audit entry records the user, and the real user when someone acted on their behalf; the server date and time; the action; the record; and the old and new value of every changed field, child-table rows included. Creation and deletion entries keep the whole record."
source = "21 CFR 11.10(e)"
status = "implemented"

[[requirement]]
id = "URS-CMP-009"
module = 50
title = "Audit entries cannot be edited or deleted by any user, including system managers, and never overwrite or hide earlier entries."
source = "21 CFR 11.10(e)"
status = "implemented"

[[requirement]]
id = "URS-CMP-010"
module = 50
title = "Each record's audit entries form a fingerprinted chain, so that an altered entry, and an entry removed or inserted before the newest, is detected by a verification that authorised reviewers can run on the record; the newest entries are protected by the rule that no entry is ever deleted, by access control and by the periodic archives."
source = "Data integrity (ALCOA+); 21 CFR 11.10(e); daily seal dropped by decision of 2026-10-06; verification on the record and the wording on the newest entries after the robustness review of 2026-10-07"
status = "implemented"

[[requirement]]
id = "URS-CMP-011"
module = 50
title = "Cancelling or amending a regulated record, or editing it after submission, requires a reason, which is stored in the audit entry; when another record's action changes it after submission, its audit entry names that record instead; a status command run on a submitted record (close, hold, stop, re-open) is recorded with the command used."
source = "21 CFR 11.10(e); ISO 13485 4.2.5; design approved 2026-10-06; changes caused by another record clarified 2026-10-07 (job cards update work orders); status commands scoped after the robustness review of 2026-10-07"
status = "implemented"

[[requirement]]
id = "URS-CMP-012"
module = 50
title = "Authorised reviewers can search the audit trail by record, user, action and date range, see it on each regulated record, and export it, without being able to change it."
source = "21 CFR 11.10(b), 11.10(e)"
status = "implemented"

[[requirement]]
id = "URS-CMP-013"
module = 50
title = "The regulated record types are declared in code, including every record type this app builds, and each is audited from the moment it is declared."
source = "Validation scope; design approved 2026-10-06"
status = "implemented"

[[requirement]]
id = "URS-CMP-031"
module = 50
title = "Who created a regulated record, and when, can never be changed, through the form or the API."
source = "21 CFR 11.10(e); ALCOA+ attributable; found in the robustness review of 2026-10-07"
status = "implemented"

# --- Module 47: roles and permissions (21 CFR 11.10(d), (g)) ---------------
[[requirement]]
id = "URS-CMP-014"
module = 47
title = "Each person is given a job profile that grants exactly the roles that job needs; the job profiles and the roles in them are declared in code and applied on every site."
source = "D2 Role Based Access (RBAC); 21 CFR 11.10(d); design approved 2026-10-06; jobs decided on the client's instruction of 2026-10-07"
status = "implemented"

[[requirement]]
id = "URS-CMP-015"
module = 47
title = "For every regulated business record type, which roles may read, create, submit, cancel and amend it is declared in code and applied exactly, replacing the platform's default permissions, and any manual change is undone on the next migrate."
source = "21 CFR 11.10(d), (g); ISO 13485 4.2.4"
status = "implemented"

[[requirement]]
id = "URS-CMP-016"
module = 47
title = "No role may delete, share or import a regulated record."
source = "ISO 13485 4.2.5; CDSCO MDR 2017 Fifth Schedule; 21 CFR 11.10(c)"
status = "implemented"

[[requirement]]
id = "URS-CMP-017"
module = 47
title = "System administrators can read regulated records but cannot create, submit, cancel or amend them."
source = "21 CFR 11.10(g); design approved 2026-10-06"
status = "implemented"

[[requirement]]
id = "URS-CMP-018"
module = 47
title = "Inspection results are recorded and submitted by QC inspectors and corrected only by QA; operators record their operations but cannot create, submit or cancel production records."
source = "ISO 13485 7.5.1, 8.2.6; design approved 2026-10-06"
status = "implemented"

[[requirement]]
id = "URS-CMP-034"
module = 47
title = "Whoever administers the system holds no business role, so no one can both grant access and use it to do or approve regulated work."
source = "21 CFR 11.10(g); EU GMP Annex 11 §12; decided on the client's instruction of 2026-10-07"
status = "implemented"

[[requirement]]
id = "URS-CMP-035"
module = 47
title = "After a person signs out, the next person starts on a clean sign-in page and is never taken to the record the previous person had open."
source = "21 CFR 11.10(d); shared shop-floor terminals; found in the live pilot test of 2026-10-07"
status = "implemented"

# --- Module 48: approval workflows (D1 approval points "A") ----------------
[[requirement]]
id = "URS-CMP-019"
module = 48
title = "A quotation can be sent to the customer only after internal price approval; the approver approves it or returns it for revision."
source = "D1 Internal Price Approval? / Revise - Re-estimate; Management approves every quotation, decided on the client's instruction of 2026-10-07"
status = "implemented"

[[requirement]]
id = "URS-CMP-020"
module = 48
title = "A purchase order is issued only after purchase approval; the approver approves it or returns it for revision, and only the approver cancels it."
source = "D1 Purchase Approval? / Revise; Management approves every purchase order, decided on the client's instruction of 2026-10-07"
status = "implemented"

[[requirement]]
id = "URS-CMP-021"
module = 48
title = "An approval cannot be bypassed: a record under an approval workflow is submitted only from its awaiting-approval state, only by a role allowed to approve it, and never by the person who raised it, whether through the form or the API."
source = "21 CFR 11.10(f), (g); design approved 2026-10-07"
status = "implemented"

[[requirement]]
id = "URS-CMP-022"
module = 48
title = "The approval workflows are declared in code and applied on every site; on a site they cannot be changed, switched off, deleted or replaced by another workflow, and every setting is restored on each migrate."
source = "Configuration as code; ISO 13485 4.1.6; strengthened after the robustness review of 2026-10-07"
status = "implemented"

[[requirement]]
id = "URS-CMP-032"
module = 48
title = "While a record awaits approval only its approver can change it, and a record's approval state always matches whether it is submitted, so it never shows as approved without having been approved."
source = "D1 Internal Price Approval, Purchase Approval; 21 CFR 11.10(f); found in the robustness review of 2026-10-07"
status = "implemented"

[[requirement]]
id = "URS-CMP-033"
module = 48
title = "Once a quotation or purchase order is approved, its items, quantities and prices cannot be changed; a change is made by cancelling and amending it, which needs approval again."
source = "D1 Internal Price Approval, Purchase Approval; decided on the client's instruction of 2026-10-07"
status = "implemented"

# --- Module 54: record retention and archival (D3 Retention & Archival) ----
[[requirement]]
id = "URS-CMP-023"
module = 54
title = "Every regulated record type, the audit trail, the electronic signatures and the login history have a declared retention period of at least ten years with its legal basis, which QA can view in the system."
source = "D3 Retention & Archival; ISO 13485 4.2.5; EU MDR Art. 10(8); 10 years decided on the client's instruction of 2026-10-07"
status = "implemented"

[[requirement]]
id = "URS-CMP-024"
module = 54
title = "Login, logout, failed-login and impersonation records are kept for their retention period instead of being cleared after 90 days."
source = "21 CFR 11.10(d), (e), (g)"
status = "implemented"

[[requirement]]
id = "URS-CMP-025"
module = 54
title = "QA can produce an archive copy of every regulated record changed in a period, each in full with its audit history and electronic signatures, together with the period's login history, in a file that can be read without the system; the records stay in the system."
source = "D3 Retention & Archival; 21 CFR 11.10(b)"
status = "implemented"

[[requirement]]
id = "URS-CMP-026"
module = 54
title = "Every archive carries a fingerprint of the whole file and of every file in it, can be verified at any time so that any changed, removed or added file is detected, and cannot be changed or deleted."
source = "21 CFR 11.10(c); data integrity (ALCOA+)"
status = "implemented"

# --- Module 51: alerts and notifications (D2 Alerts & Notifications) -------
[[requirement]]
id = "URS-CMP-027"
module = 51
title = "Stores and QA are alerted once when a lot with stock remaining is 30 days or less from its expiry date, including a lot received that close to it, and once when it has expired, even after a day the alerts did not run; a changed expiry date is alerted afresh; lots with no stock and disabled lots raise no alert."
source = "D2 Alerts & Notifications; module 51 lot expiry; 30 days decided on the client's instruction of 2026-10-07; exact-date gaps found in the robustness review of 2026-10-07"
status = "implemented"

[[requirement]]
id = "URS-CMP-028"
module = 51
title = "The approver is alerted when a quotation or purchase order is waiting for approval, and the person who raised it is alerted when it is approved or returned for revision."
source = "D1 approval points; module 48 approvals"
status = "implemented"

[[requirement]]
id = "URS-CMP-029"
module = 51
title = "The alerts are declared in code, applied on every site, and cannot be edited on a site."
source = "Configuration as code; ISO 13485 4.1.6"
status = "implemented"

# --- Module 18: inventory by batch ------------------------------------------
[[requirement]]
id = "URS-STK-001"
module = 18
title = "Every lot of material and product can be tracked as a batch on every site."
source = "D2 Inventory by Batch (Lot Control); D3 Batch / Lot Traceability Flow"
status = "implemented"

[[requirement]]
id = "URS-STK-002"
module = 18
title = "When stock is picked or issued, the lot that expires first is taken first."
source = "D3 Putaway in Finished Goods Warehouse (FIFO / FEFO)"
status = "implemented"

[[requirement]]
id = "URS-STK-003"
module = 18
title = "Stock can never go below zero, for any item or lot."
source = "D3 Batch / Lot Traceability Flow; data integrity (ALCOA+)"
status = "implemented"

[[requirement]]
id = "URS-PLT-006"
module = 0
title = "A pilot site can be loaded with fictional demo data that follows the client's process (catheter and urine bag lines with the D3 process steps, quarantine, rejected and hold stores, and one demo user per job), and the demo data can never be loaded on any other site."
source = "Delivery plan Phase 2 (pilot), decided 2026-10-07; D2, D3"
status = "implemented"

[[requirement]]
id = "URS-PLT-007"
module = 0
title = "On the pilot's demo data, the standard flow runs end to end with each step done by its job: enquiry, quotation with price approval and sales order; purchase request, purchase order with approval and goods receipt by batch into quarantine; work order on the line's routing with material issue, operations and a finished lot with its expiry; and delivery of that lot, all recorded in the audit trail."
source = "Delivery plan Phase 2 (pilot), decided 2026-10-07; D1, D2, D3"
status = "implemented"

# --- Module 30: document control (D2 Document Control; ISO 13485 4.2.4) ----
[[requirement]]
id = "URS-QMS-001"
module = 30
title = "Every controlled document (SOP, work instruction, form, specification, packaging and labelling, quality manual, external document) is registered by QA with a unique number TYPE-DEPARTMENT-### and a process owner, and is issued in numbered revisions, one in progress at a time."
source = "D2 Document Control; ISO 13485 4.2.4; numbering decided on the client's instruction of 2026-10-07"
status = "implemented"

[[requirement]]
id = "URS-QMS-002"
module = 30
title = "A revision is signed by its author, reviewed by someone other than the author and approved by QA, never by its author or its reviewer, each with an electronic signature; the reviewer or QA can return it for changes with a reason, and every revision after the first states what changed."
source = "D2 Review & Approval, Version Control; ISO 13485 4.2.4 a), b); 21 CFR 11.50; approver other than the reviewer decided on the client's instruction of 2026-10-07"
status = "implemented"

[[requirement]]
id = "URS-QMS-003"
module = 30
title = "The document file is fingerprinted when its author signs; approval is refused if the file has changed since, the file cannot then be deleted, made public or replaced, and a revision cannot be changed, submitted or changed after submission except through the signed acts."
source = "ISO 13485 4.2.4; 21 CFR 11.10(a), 11.70"
status = "implemented"

[[requirement]]
id = "URS-QMS-004"
module = 30
title = "An approved revision takes effect on its effective date, never earlier than its approval, and the revision it replaces is superseded automatically; the document then shows its effective revision and its next review date."
source = "ISO 13485 4.2.4 c); review period decided on the client's instruction of 2026-10-07"
status = "implemented"

[[requirement]]
id = "URS-QMS-005"
module = 30
title = "Outside QA, people see only the effective revision of each document, and the drafts they author or review, so superseded and withdrawn revisions are not used by mistake; no document or revision is ever deleted or cancelled."
source = "ISO 13485 4.2.4 d), g), h)"
status = "implemented"

[[requirement]]
id = "URS-QMS-006"
module = 30
title = "QA can withdraw a document with an electronic signature and a reason, once no revision is in progress; the document and its effective revision become obsolete and are kept."
source = "ISO 13485 4.2.4 g), h); 4.2.5"
status = "implemented"
