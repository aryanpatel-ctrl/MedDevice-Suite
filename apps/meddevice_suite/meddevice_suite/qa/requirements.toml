source = "Found necessary in the live pilot test of 2026-10-07: the screens each job uses were not tested as that job"
status = "implemented"

# --- Module 30: document control (D2 Document Control; ISO 13485 4.2.4) ----
[[requirement]]
id = "URS-QMS-001"
module = 30
title = "Every controlled document (SOP, work instruction, form, specification, packaging and labelling, quality manual, external document) is registered by QA with a unique number TYPE-DEPARTMENT-### and a process owner, and is issued in numbered revisions, one in progress at a time."
source = "D2 Document Control; ISO 13485 4.2.4; numbering decided on the client's instruction of 2026-10-07"
status = "implemented"

[[requirement]]
id = "URS-QMS-002"
module = 30
title = "A revision is signed by its author, reviewed by someone other than the author and approved by QA, never by its author or its reviewer, each with an electronic signature; the reviewer or QA can return it for changes with a reason, and every revision after the first states what changed."
source = "D2 Review & Approval, Version Control; ISO 13485 4.2.4 a), b); 21 CFR 11.50; approver other than the reviewer decided on the client's instruction of 2026-10-07"
status = "implemented"

[[requirement]]
id = "URS-QMS-003"
module = 30
title = "The document file is fingerprinted when its author signs; approval is refused if the file has changed since, the file cannot then be deleted, made public or replaced, and a revision cannot be changed, submitted or changed after submission except through the signed acts."
source = "ISO 13485 4.2.4; 21 CFR 11.10(a), 11.70"
status = "implemented"

[[requirement]]
id = "URS-QMS-004"
module = 30
title = "An approved revision takes effect on its effective date, never earlier than its approval, and the revision it replaces is superseded automatically; the document then shows its effective revision and its next review date."
source = "ISO 13485 4.2.4 c); review period decided on the client's instruction of 2026-10-07"
status = "implemented"

[[requirement]]
id = "URS-QMS-005"
module = 30
title = "Outside QA, people see only the effective revision of each document, and the drafts they author or review, so superseded and withdrawn revisions are not used by mistake; no document or revision is ever deleted or cancelled."
source = "ISO 13485 4.2.4 d), g), h)"
status = "implemented"

[[requirement]]
id = "URS-QMS-006"
module = 30
title = "QA can withdraw a document with an electronic signature and a reason, once no revision is in progress; the document and its effective revision become obsolete and are kept."
source = "ISO 13485 4.2.4 g), h); 4.2.5"
status = "implemented"


[[requirement]]
id = "URS-QMS-007"
module = 30
title = "Each effective document's process owner and QA are alerted once when its periodic review falls due within 30 days, including a review already overdue or a day the alerts did not run, and again for each new review date."
source = "ISO 13485 4.2.4 b) (review and update documents); 30 days as for lot expiry, decided on the client's instruction of 2026-10-07"
status = "implemented"

[[requirement]]
id = "URS-QMS-008"
module = 30
title = "A revision prints as a controlled copy with its signatures only while it is effective, and otherwise as uncontrolled and not for use; its form says whether it is in use, and offers each signed act only to the person allowed to take it, with no other way to approve it."
source = "ISO 13485 4.2.4 d), g); 21 CFR 11.50(b); design approved 2026-10-07 (document control step C)"
status = "implemented"
# --- Module 36: change control (D2 Change Control; ISO 13485 4.1.4, 7.3.9) ---
# Design approved 2026-10-08. Choices left open by the diagrams were decided under the
# client's instruction of 2026-10-07 to take every open choice: who may raise and approve,
# the 90-day effectiveness check, Major needing Management, withdrawal by the requester.
[[requirement]]
id = "URS-QMS-009"
module = 36
title = "Anyone in a business job can raise a change request, numbered CR-YYYY-####, stating what is to change, why, its type (document, product or BOM, process or routing, equipment, supplier, system) and the records it affects; nothing changes under it until it is approved."
source = "D2 Change Control: Change Request; ISO 13485 4.1.4, 7.3.9; who may raise decided under the client's instruction of 2026-10-07"
status = "implemented"

[[requirement]]
id = "URS-QMS-010"
module = 36
title = "QA assesses every change request before it can be approved, recording its impact on product quality, risk, regulatory notification, validation, training, documents and stock in hand, and classifies it Minor or Major; a change that needs regulatory notification is always Major."
source = "D2 Change Control: Impact Assessment; ISO 13485 7.3.9 (evaluate the effect of changes), 4.1.4; CDSCO MDR 2017 (notification of changes)"
status = "implemented"

[[requirement]]
id = "URS-QMS-011"
module = 36
title = "A Minor change is approved by QA and a Major change by QA and then Management, by two different people, each with an electronic signature, and never by the person who raised it; QA, or Management for a Major change awaiting its approval, can return it to the person who raised it, or reject it, with a signature and a reason."
source = "D2 Change Control: Review & Approval; ISO 13485 7.3.9; 21 CFR 11.50; Management approval of Major changes decided under the client's instruction of 2026-10-07"
status = "implemented"

[[requirement]]
id = "URS-QMS-012"
module = 36
title = "A change is implemented through the actions approved with it, each with an owner, a due date and, where one exists, the record it changes; no action can be done before approval or changed after it, each is done by its owner or QA with a note, and the change is implemented once every action is done."
source = "D2 Change Control: Implementation; ISO 13485 7.3.9, 4.2.5; wording clarified 2026-10-10: an action such as training changes no record"
status = "implemented"

[[requirement]]
id = "URS-QMS-013"
module = 36
title = "A change is closed only once QA has verified its effectiveness with an electronic signature, recording it as effective or not effective with a note, on or after its check date: 90 days after implementation unless QA set another number of days when assessing it."
source = "D2 Change Control: Effectiveness Check, Change History; ISO 13485 7.3.9, 8.5.2; 90 days decided under the client's instruction of 2026-10-07"
status = "implemented"

[[requirement]]
id = "URS-QMS-014"
module = 36
title = "A new revision of a controlled document that has an effective revision can be started only under an approved change request that lists that document; the first revision of a new document needs none, and revisions started before this rule are not affected."
source = "D2 Change Control linked to Document Control; ISO 13485 4.2.4 b), 7.3.9"
status = "implemented"

[[requirement]]
id = "URS-QMS-015"
module = 36
title = "QA is alerted when a change request awaits assessment or approval and Management when a Major change awaits its approval; the person who raised it when it is approved, returned or rejected; each action owner once when their action is due within 7 days or overdue; and QA once when an effectiveness check falls due."
source = "D2 Alerts & Notifications; ISO 13485 7.3.9"
status = "implemented"

[[requirement]]
id = "URS-QMS-016"
module = 36
title = "A change request is never deleted or cancelled: the person who raised it can withdraw it with a reason until it is approved, and withdrawn, rejected and closed requests are kept; QA and Management see every request, others only those they raised or have an action on."
source = "ISO 13485 4.2.5; 21 CFR 11.10(c), (d); withdrawal by the requester decided under the client's instruction of 2026-10-07"
status = "implemented"

# --- Wave 1: lot status and incoming QC (modules 1, 4, 6, 16, 17) ----------------
# Planned on 2026-10-08 from the Phase 0 gap audit: the diagrams' first quality gate.
# Each becomes `implemented` only with its passing tests. On 2026-10-08 the client
# instructed that the certification details come at the end and that every open choice
# is ours until then, taken on the standard; the choices taken are named in each source
# and are confirmed or changed through change control when those details arrive.

[[requirement]]
id = "URS-STK-004"
module = 17
title = "Every lot carries a status, Quarantine, Approved, Rejected or Hold; a lot received or produced starts in Quarantine, and the status changes only through a signed QA release or disposition, never by editing the lot; stock comes into a lot only on the document that made it, lots moved between stores and returns aside, so more stock, a count gain or opening stock comes in as a new lot."
source = "D2 Quarantine / Approved Stock; D3 QC Approval / Rejection, Putaway in Warehouse (Batch/Location); D4 3.5 Accept / Reject / Hold, 3.3 Internal Batch Creation, 4.6 Batch Creation; ISO 13485 7.5.8, 8.3; 21 CFR 11.50; no stock into an existing lot decided on 2026-10-09 from DFD 3.1-3.6"
status = "implemented"

[[requirement]]
id = "URS-STK-005"
module = 17
title = "No stock of a lot that is not Approved can be issued to production, transferred to an approved store, picked, packed or delivered, through the form or the API; a Quarantine, Hold or Rejected lot moves only into the quarantine, hold, rejected or returns stores, or back to its supplier."
source = "D2 Material Issue (From Approved Stock), Reject / Return To Supplier; D3 Rejected (return flow); D4 4.3 Issue Material, 7.2 Allocate Released Batch; ISO 13485 7.5.8, 8.3"
status = "implemented"

[[requirement]]
id = "URS-STK-006"
module = 17
title = "A lot shows its status, who set it, when and why, and the stock reports show quantities by lot status, so Stores and QA see at any time what is in quarantine, on hold, rejected or approved."
source = "D2 Inventory by Batch (Lot Control); D4 D4 Inventory & Batch Ledger; ISO 13485 7.5.8"
status = "implemented"

[[requirement]]
id = "URS-STK-007"
module = 17
title = "When lot status is installed on a site that already holds stock, every lot is given a status by a migration recorded in the audit trail: lots in the approved and finished goods stores become Approved, every other lot Quarantine."
source = "Engineering rules section 8 (schema changes migrate existing data); ISO 13485 4.2.5; status by store role decided under the client's instruction of 2026-10-08, confirmed against the physical count at cutover"
status = "implemented"

[[requirement]]
id = "URS-QC-001"
module = 16
title = "A goods receipt records, per line, the supplier's lot number and the supplier's certificate (analysis or conformity) as a file attached by Stores; the QC Inspector records its verification against the purchase specification, and incoming inspection cannot start for a lot whose certificate is not verified."
source = "D3 Document Verification (COA / COC / ISO); D4 3.1, 3.2; ISO 13485 7.4.3; verification by QC decided under the client's instruction of 2026-10-08"
status = "implemented"

[[requirement]]
id = "URS-QC-002"
module = 16
title = "Incoming quality control is a Quality Inspection of type Incoming per received lot against the item's inspection template, recorded and submitted by a QC Inspector; the sample size, parameters and limits come from the template, each reading records the instrument used, and the result is Accepted or Rejected."
source = "D2 Incoming QC (IQC); D3 Incoming Quality Inspection (IQC); D4 3.4 IQC Inspection; ISO 13485 7.4.3, 7.6, 8.2.6"
status = "implemented"

[[requirement]]
id = "URS-QC-003"
module = 16
title = "A lot that enters stock other than from a work order (on a goods receipt, or on a material receipt such as opening stock) is released by QA with an electronic signature only once an accepted incoming inspection made on the document that brought it in exists for it: release sets the lot Approved and moves its stock to the approved store in one audited transaction; QA can instead reject it with a signature and a reason, which sets it Rejected, moves the stock to the rejected store and creates the return to the supplier for Purchase; or hold it, which sets it Hold and moves it to the hold store; a held lot is released only after a new accepted inspection and with a reason."
source = "D2 Pass? No: Reject / Return To Supplier, Yes: Put Away; D3 Accepted / Rejected; D4 3.5, 3.6; ISO 13485 7.4.3, 8.3; 21 CFR 11.50; release of a held lot after retest decided under the client's instruction of 2026-10-08; inspection of material-receipt lots, and opening stock loaded as material receipts and inspected (DFD 3.1-3.5), decided on 2026-10-09"
status = "implemented"

[[requirement]]
id = "URS-QC-004"
module = 16
title = "QA and Stores see every lot awaiting inspection and every inspected lot awaiting release, with the days each has waited, and the finished lot of a work order is released for dispatch by the same signed QA release until final QC and batch release (modules 25, 26) replace it."
source = "D2 Quarantine / Approved Stock; D4 3.5; interim scope decided in the Phase 0 gap audit of 2026-10-08"
status = "implemented"

[[requirement]]
id = "URS-PUR-001"
module = 4
title = "Every supplier has an approval status, Approved, Conditional or Not Approved, set by QA with an electronic signature and a reason, with the items it is approved for and the expiry date of its certificate; a purchase order for an item from a supplier not approved for it is refused; goods are received only on a goods receipt, never by a purchase invoice that updates stock, and each line only from a supplier approved for its item at the time of receipt, whatever order it was placed under; a Conditional approval has an expiry date, each purchase order under it needs a reason and its lots are inspected at 100 percent; QA and Purchase are alerted once, 30 days before a supplier certificate expires."
source = "D2 Vendor Master, Supplier; D3 Purchase Order to Vendor; D4 2.5 Vendor Management; ISO 13485 7.4.1; conditional approval rules and the 30-day alert decided under the client's instruction of 2026-10-08; the goods receipt as the only way in, and receipt only from a supplier approved at receipt, decided on 2026-10-09"
status = "implemented"

[[requirement]]
id = "URS-MST-001"
module = 1
title = "Each of the nine masters (item, bill of materials, routing, operation and work centre, supplier, customer, warehouse, equipment, inspection template) carries a version number and an effective date; a change to the controlled fields of a master in use is made only under an approved change request that lists it, raises the version, and is recorded with the previous values in the audit trail; ERPNext's BOM Update Tool does not replace a bill of materials inside approved ones, a changed bill of materials being a new one under change control."
source = "D2 All masters are version controlled and linked with Document Control; D4 D3 Item / BOM / Routing Master; ISO 13485 4.2.4, 7.3.9; blocking the BOM Update Tool's replace decided on 2026-10-09"
status = "implemented"

[[requirement]]
id = "URS-MST-002"
module = 6
title = "An item's inspection template is a controlled specification that states, for each inspection stage (incoming, in-process, final), the parameters, method, limits and sample size, and a template in use changes only under an approved change request."
source = "D2 Specifications & Tests; D3 Specification; D4 D3; ISO 13485 7.1, 8.2.6"
status = "implemented"

[[requirement]]
id = "URS-MST-003"
module = 1
title = "An item is set up in draft and approved by QA with an electronic signature before it is used; until then every record that puts it to use (a material request, request for quotation, supplier quotation, order, quotation, receipt, stock entry or count, lot, bill of materials, work order, job card, inspection, delivery, invoice, pick list, packing slip, product bundle, alternative or asset) is refused for it, from the desk or the API; the approval is given only by the signed act, a variant is approved on its own, and from approval the item's controlled fields change only under an approved change request."
source = "D2 All masters are version controlled and linked with Document Control; master plan section 3 (masters approved before use); DFD D3 Item / BOM / Routing Master; ISO 13485 4.2.4, 7.5.1; 21 CFR 11.10(g); decided 2026-10-10 under the client's instruction to follow the DFD: each variant approved on its own (GS1, one GTIN per variant); items held before the module approved by QA one by one, never by migration (21 CFR 11.50)"
status = "planned"

[[requirement]]
id = "URS-MST-004"
module = 1
title = "Every item states its type (raw material, packaging, sub-assembly, finished good, consumable, spare part or equipment) and keeps it once approved; a raw material, packaging item, sub-assembly or finished good is lot-tracked with a shelf life, an expiry date on every lot and its storage condition, and QA cannot approve it otherwise."
source = "D2 Inventory by Batch (Lot Control); DFD 3.3 Internal Batch Creation, D4; master plan section 3 (batch-tracked items cannot be received, issued or sold without a batch); ISO 13485 7.5.8, 7.5.9; item types from the master-data template of 2026-10-09, with Equipment for the items behind assets (decided 2026-10-10)"
status = "planned"

[[requirement]]
id = "URS-MST-005"
module = 1
title = "A finished good states whether it is supplied sterile, its device class under the Medical Devices Rules 2017 (A, B, C, D, or not a device), its storage condition, its pack sizes (units per box, boxes per carton) and its UDI device identifier, a well-formed GTIN that no other item carries; QA cannot approve a finished good without them."
source = "D2 Labels carry batch, manufacturing date, expiry date, UDI and barcode; DFD 6.2 Label Printing, D3; CDSCO MDR 2017 Chapter VI (labelling) and UDI; 21 CFR 830; device class and storage condition kept on 2026-10-10 as D3 regulatory data; printing them on the label is module 23's requirement, not this one's"
status = "planned"

[[requirement]]
id = "URS-MST-006"
module = 1
title = "A raw material or packaging item is approved only when incoming inspection is required for it and it has a specification for the incoming stage; a finished good only when it has a specification for the final stage; and an approved item cannot lose them."
source = "DFD 3.4 IQC Inspection, 5.3 Final QC Inspection, D6; D2 Incoming QC (IQC), Final QC Testing; master plan section 3 (inspection required at receipt and at which stages, linked specification); ISO 13485 7.4.3, 8.2.6"
status = "planned"

[[requirement]]
id = "URS-MST-010"
module = 8
title = "Each piece of equipment is an asset recording its unique equipment tag, its class (production machine, measuring instrument, test equipment, sterilization equipment or utility), manufacturer, model and serial number, where it is used, whether it affects product quality, and whether it needs calibration, preventive maintenance and qualification with their intervals, a measuring instrument always needing calibration; QA approves it with an electronic signature only when these are complete, and that signature is the only way it becomes approved; an inspection reading names as its instrument only approved equipment that is in service; once approved, what QA approved changes only under an approved change request."
source = "DFD D10 Equipment Master and 9D Equipment Management (D1 equipment master); master plan tracker step 10 (equipment master with the history card), the flowchart's equipment module (equipment master, calibration schedule, maintenance plan) and decision of 10 October 2026 (an Equipment item behind each asset); ISO 13485 6.3, 7.5.1, 7.6; 21 CFR 820.70(g), 820.72; 21 CFR 11.50, 11.70; calibration and maintenance due dates and their blocking are module 38, qualification records module 40; decided 2026-10-11 under the client's instruction to follow the DFD"
status = "implemented"

[[requirement]]
id = "URS-MST-011"
module = 62
title = "Each piece of equipment has a history card that lists, by date, its approval and every change to its record, its movements, its maintenance and calibration logs, its repairs with their downtime, and the inspections that used it as their instrument, with the number of repairs and the total downtime over the period shown."
source = "DFD 9D Equipment Management (D2 history card, D5 performance tracking); master plan module 62 (equipment history card and performance tracking, beyond module 38); ISO 13485 6.3, 7.6 (records of maintenance and calibration); decided 2026-10-11"
status = "implemented"

[[requirement]]
id = "URS-MST-012"
module = 3
title = "Each operation, workstation and routing is approved by QA with an electronic signature before it is used, and that signature is the only way it becomes approved: an operation only when it names its work instruction, an effective controlled document of type Work Instruction, and states whether it carries an in-process check; a workstation only when every piece of equipment at it is approved; a routing only when each of its operations and their workstations is approved; a bill of materials with an unapproved routing, operation or workstation is not submitted, and no work order or job card is made on an unapproved operation or workstation; once approved, what QA approved changes only under an approved change request."
source = "Master plan section 3 (masters are created in draft, reviewed and approved by the responsible role before they can be used in a transaction; Routing holds the operation sequence, the work center, machine and the in-process checks attached to each operation), section 6 (every operation carries its in-process checks), stage 3 (released only when BOM and routing are approved versions); DFD D2 (all masters are version controlled and linked with Document Control) and D3 Item / BOM / Routing Master; user's decision of 2026-10-11 to follow the requirement rather than use these masters as is; ISO 13485 4.2.4, 7.5.1; 21 CFR 820.70(a), 11.50, 11.70; the in-process check values stay on the item's in-process specification (module 6), enforcing the check at the job card is module 20"
status = "implemented"

[[requirement]]
id = "URS-MST-013"
module = 7
title = "Each store is approved by QA with an electronic signature, once it is a store that holds stock of a company, and that signature is the only way it becomes approved; no stock moves into or out of a store QA has not approved, whatever the document; once approved, what QA approved changes only under an approved change request."
source = "Master plan section 3 (masters are created in draft, reviewed and approved by the responsible role before they can be used in a transaction; Warehouse: raw, quarantine, approved, WIP, finished goods, rejected and returns areas); DFD D4 Inventory & Batch Ledger; user's decision of 2026-10-11 to follow the requirement; ISO 13485 6.4, 7.5.11; 21 CFR 11.50, 11.70; store roles are module 17 (URS-STK-004 to 007), bin locations module 18"
status = "implemented"

[[requirement]]
id = "URS-PLT-010"
module = 0
title = "The pilot's standard flow performs the certificate check, incoming inspection and signed release of every received lot, and the signed release of the finished lot, by the QC Inspector and QA Manager demo users, in place of the stand-in transfer to the approved store, in both the server and the browser journey."
source = "Delivery plan Phase 2 (pilot); Phase 0 gap audit of 2026-10-08; D2, D3"
status = "planned"
