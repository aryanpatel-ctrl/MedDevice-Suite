# Scope baseline and user requirements, traced to verification tests.
#
# module.approach  ready     = standard Frappe/ERPNext/India Compliance, configuration only
#                  customise = standard base extended by this app
#                  build     = built in this app
#
# requirement.id      URS-<AREA>-<nnn>. Never reused or renumbered; withdraw instead.
# requirement.module  module number below; 0 = platform (applies across modules)
# requirement.status  planned | implemented | withdrawn
#                     an implemented requirement must be verified by at least one test
#
# Sources: client diagrams D1 (MedDevice Suite ERP flow map), D2 (Foley ERP
# flowchart, ISO 13485), D3 (Foley full workflow diagram) and D4 (data flow
# diagram, received 2026-10-08; its eCommerce process is out of scope, see module 58).
# The data flow diagram is the final requirement and is cited as "DFD", never as D4,
# because its own data stores are named D1 to D12: "DFD 3.4" is a Level 2 step,
# "DFD box 2" a Level 1 process, "DFD 9F F3" a cross-functional step and "DFD D4"
# the Inventory & Batch Ledger data store. Inside "DFD 9D", D1 to D6 are 9D's steps.
# Every source cites at least one of: a DFD step, process or data store; a client
# diagram D1, D2 or D3; a dated decision (YYYY-MM-DD); or a regulation clause. A
# requirement that traces to no DFD box or client diagram starts its source with
# "Extra" and says why it exists. The traceability check enforces the first rule.

