# --- Requirements -----------------------------------------------------------
[[requirement]]
id = "URS-PLT-001"
module = 0
title = "The desk shows only the standard areas, and the entries inside them, that the client requirement uses; every other standard area and entry is hidden for all users, including ones a future release adds."
source = "Scope decisions 2026-10-05 against D1, D2, D3 (module map)"
status = "implemented"

[[requirement]]
id = "URS-PLT-002"
module = 0
title = "Site configuration owned by this app is applied automatically and idempotently on install and on every migrate, without modifying Frappe, ERPNext or India Compliance."
source = "Engineering rules (README)"
status = "implemented"

[[requirement]]
id = "URS-PLT-003"
module = 0
title = "Every implemented requirement is verified by at least one automated test, and the traceability matrix is generated from the source."
source = "ISO 13485 4.1.6 / 21 CFR 11.10(a) software validation"
status = "implemented"

[[requirement]]
id = "URS-PLT-004"
module = 0
title = "Automated tests run on a disposable test site brought to a known state (setup completed with a fixed test company); the preparation refuses to run on a site that does not allow tests."
source = "ISO 13485 4.1.6 / 21 CFR 11.10(a): controlled test environment for software validation"
status = "implemented"

[[requirement]]
id = "URS-PLT-005"
module = 0
title = "Every Frappe module this app declares exists on the site before its DocTypes are synced, and modules the app no longer declares are removed when they hold nothing."
source = "Engineering rules: configuration is code; folder plan 2026-10-05"
status = "implemented"

# --- Module 49: electronic signature (21 CFR Part 11 subpart C) -------------

[[requirement]]
id = "URS-CMP-001"
module = 49
title = "Signing requires the signer to re-enter their own password at the moment of signing; a wrong password records no signature and counts towards the same account lockout as a failed login, and a locked account cannot sign."
source = "21 CFR 11.200(a)(1), 11.300(d); D1 E-sign points"
status = "implemented"

[[requirement]]
id = "URS-CMP-002"
module = 49
title = "Each signature records the signer's user ID and full name, the date and time, the action signed and the meaning of the signature (authored, reviewed, approved, rejected, released or verified), plus an optional reason."
source = "21 CFR 11.50(a); D1, D2 QA Review & Approval (E-Signature)"
status = "implemented"

[[requirement]]
id = "URS-CMP-003"
module = 49
title = "The signatures on a record are shown with the record, on screen and on its printouts, with name, date and time, and meaning."
source = "21 CFR 11.50(b)"
status = "implemented"

[[requirement]]
id = "URS-CMP-004"
module = 49
title = "A signature is bound to the exact content of the record at signing and to the previous signature on the same record, so that altering the signed record or any signature is detectable by verification."
source = "21 CFR 11.70"
status = "implemented"

[[requirement]]
id = "URS-CMP-005"
module = 49
title = "Signature records cannot be edited or deleted by any user, including system managers."
source = "21 CFR 11.70, 11.10(e)"
status = "implemented"

[[requirement]]
id = "URS-CMP-006"
module = 49
title = "Only an identified individual can sign: shared and system accounts (Administrator, Guest) are refused, and the signer must hold the permission the signed action requires on the record."
source = "21 CFR 11.100(a), 11.10(d), 11.10(g)"
status = "implemented"

[[requirement]]
id = "URS-CMP-030"
module = 49
title = "A person signs from the record, in a dialog that names the act and the meaning of the signature and asks for their own password; only the acts declared for that record type can be signed, and only by someone who may open the record."
source = "21 CFR 11.50, 11.200; design approved 2026-10-07 (document control)"
status = "implemented"

# --- Module 50: tamper-evident audit trail (21 CFR 11.10(e); EU GMP Annex 11 §9) ---

[[requirement]]
id = "URS-CMP-007"
module = 50
title = "Every create, change, submit, cancel, amend, discard, rename and delete of a regulated record, including values that code writes through the record itself (such as a status set on submit), is recorded in the audit trail automatically and exactly once, without any action by the user."
source = "21 CFR 11.10(e); design approved 2026-10-06"
status = "implemented"

[[requirement]]
id = "URS-CMP-008"
module = 50
title = "Each audit entry records the user, and the real user when someone acted on their behalf; the server date and time; the action; the record; and the old and new value of every changed field, child-table rows included. Creation and deletion entries keep the whole record."
source = "21 CFR 11.10(e)"
status = "implemented"

[[requirement]]
id = "URS-CMP-009"
module = 50
title = "Audit entries cannot be edited or deleted by any user, including system managers, and never overwrite or hide earlier entries."
source = "21 CFR 11.10(e)"
status = "implemented"

[[requirement]]
id = "URS-CMP-010"
module = 50
title = "Each record's audit entries form a fingerprinted chain, so that an altered entry, and an entry removed or inserted before the newest, is detected by a verification that authorised reviewers can run on the record; the newest entries are protected by the rule that no entry is ever deleted, by access control and by the periodic archives."
source = "Data integrity (ALCOA+); 21 CFR 11.10(e); daily seal dropped by decision of 2026-10-06; verification on the record and the wording on the newest entries after the robustness review of 2026-10-07"
status = "implemented"

[[requirement]]
id = "URS-CMP-011"
module = 50
title = "Cancelling or amending a regulated record, or editing it after submission, requires a reason, which is stored in the audit entry; when another record's action changes it after submission, its audit entry names that record instead; a status command run on a submitted record (close, hold, stop, re-open) is recorded with the command used."
source = "21 CFR 11.10(e); ISO 13485 4.2.5; design approved 2026-10-06; changes caused by another record clarified 2026-10-07 (job cards update work orders); status commands scoped after the robustness review of 2026-10-07"
status = "implemented"

[[requirement]]
id = "URS-CMP-012"
module = 50
title = "Authorised reviewers can search the audit trail by record, user, action and date range, see it on each regulated record, and export it, without being able to change it."
source = "21 CFR 11.10(b), 11.10(e)"
status = "implemented"

[[requirement]]
id = "URS-CMP-013"
module = 50
title = "The regulated record types are declared in code, including every record type this app builds, and each is audited from the moment it is declared."
source = "Validation scope; design approved 2026-10-06"
status = "implemented"

[[requirement]]
id = "URS-CMP-031"
module = 50
title = "Who created a regulated record, and when, can never be changed, through the form or the API."
source = "21 CFR 11.10(e); ALCOA+ attributable; found in the robustness review of 2026-10-07"
status = "implemented"

# --- Module 47: roles and permissions (21 CFR 11.10(d), (g)) ---------------
[[requirement]]
id = "URS-CMP-014"
module = 47
title = "Each person is given a job profile that grants exactly the roles that job needs; the job profiles and the roles in them are declared in code and applied on every site."
source = "D2 Role Based Access (RBAC); 21 CFR 11.10(d); design approved 2026-10-06; jobs decided on the client's instruction of 2026-10-07"
status = "implemented"

[[requirement]]
id = "URS-CMP-015"
module = 47
title = "For every regulated business record type, which roles may read, create, submit, cancel and amend it is declared in code and applied exactly, replacing the platform's default permissions, and any manual change is undone on the next migrate."
source = "21 CFR 11.10(d), (g); ISO 13485 4.2.4"
status = "implemented"

[[requirement]]
id = "URS-CMP-016"
module = 47
title = "No role may delete, share or import a regulated record."
source = "ISO 13485 4.2.5; CDSCO MDR 2017 Fifth Schedule; 21 CFR 11.10(c)"
status = "implemented"

[[requirement]]
id = "URS-CMP-017"
module = 47
title = "System administrators can read regulated records but cannot create, submit, cancel or amend them."
source = "21 CFR 11.10(g); design approved 2026-10-06"
status = "implemented"

[[requirement]]
id = "URS-CMP-018"
module = 47
title = "Inspection results are recorded and submitted by QC inspectors and corrected only by QA; operators record their operations but cannot create, submit or cancel production records."
source = "ISO 13485 7.5.1, 8.2.6; design approved 2026-10-06"
status = "implemented"

[[requirement]]
id = "URS-CMP-034"
module = 47
title = "Whoever administers the system holds no business role, so no one can both grant access and use it to do or approve regulated work."
source = "21 CFR 11.10(g); EU GMP Annex 11 §12; decided on the client's instruction of 2026-10-07"
status = "implemented"

[[requirement]]
id = "URS-CMP-035"
module = 47
title = "After a person signs out, the next person starts on a clean sign-in page and is never taken to the record the previous person had open."
source = "21 CFR 11.10(d); shared shop-floor terminals; found in the live pilot test of 2026-10-07"
status = "implemented"

[[requirement]]
id = "URS-CMP-036"
module = 47
title = "Every lookup in a form a job fills in can be searched by that job, apart from a reviewed list of features the client's process does not use, so nobody meets a permission error doing their own work; looking a record up never lets the person open it."
source = "21 CFR 11.10(d); least privilege; found in the live pilot test of 2026-10-07 (operator time logs)"
status = "implemented"

[[requirement]]
id = "URS-CMP-037"
module = 47
title = "A person signs in only with their own user ID (their email address) and password, never by a link mailed to them; a password meets the strength QA sets (strong or very strong) and must be replaced after the number of days QA sets (30 to 365, 90 until QA changes it); a session ends after the minutes of inactivity QA sets (5 to 480, 30 until QA changes it); these values change only in Quality Settings under an approved change request, and a change to them, or to the account lockout, made in the site's System Settings is refused."
source = "Master plan section 10 (validation and system security: password policy, session timeout, account lockout); D1 System Foundation; 21 CFR 11.10(d), 11.100, 11.300; values decided 2026-10-11; no password history (11.300 met by unique IDs, strength, aging and lockout; decided 2026-10-11)"
status = "implemented"

[[requirement]]
id = "URS-CMP-038"
module = 47
title = "Nobody changes the configuration of a site by hand: no role, the system administrator included, may create, change or delete custom fields, property setters, form customisations or client and server scripts, which change only with a release of this app, applied on install and migrate; a permission added by hand to change them does not last; and every change made to the configuration of the site (these records, print formats, workflows, alerts, and the manufacturing, buying, selling and print settings) is recorded in the audit trail with its old and new values."
source = "Engineering rules section 1.3 (configuration is code); master plan section 10 (the audit trail covers masters, records and configuration); D1 System Foundation (Validation and system security); 21 CFR 11.10(a), (e), (k); found 2026-10-11: a system administrator could add fields, scripts and form changes on the live site with no record"
status = "implemented"

[[requirement]]
id = "URS-CMP-039"
module = 47
title = "Once a working site is set up, the built-in Administrator account does not sign in, by the login page or the API, and a session it already holds is refused at its next request, so that every action on the site is a named person's; for maintenance, a window opened on the server for a stated time lets it in until that time; development, test and pilot sites, and a site whose setup is not complete, keep it."
source = "Master plan section 10 (the built-in super-user disabled for daily use); go-live check V9 (2026-10-07 review); 21 CFR 11.10(d), 11.100(a), 11.300; decided 2026-10-11: a time-limited maintenance window set on the server rather than a permanent switch"
status = "implemented"

# --- Module 48: approval workflows (D1 approval points "A") ----------------
[[requirement]]
id = "URS-CMP-019"
module = 48
title = "A quotation can be sent to the customer only after internal price approval; the approver approves it or returns it for revision."
source = "D1 Internal Price Approval? / Revise - Re-estimate; Management approves every quotation, decided on the client's instruction of 2026-10-07"
status = "implemented"

[[requirement]]
id = "URS-CMP-020"
module = 48
title = "A purchase order is issued only after purchase approval; the approver approves it or returns it for revision, and only the approver cancels it."
source = "D1 Purchase Approval? / Revise; Management approves every purchase order, decided on the client's instruction of 2026-10-07"
status = "implemented"

[[requirement]]
id = "URS-CMP-021"
module = 48
title = "An approval cannot be bypassed: a record under an approval workflow is submitted only from its awaiting-approval state, only by a role allowed to approve it, and never by the person who raised it, whether through the form or the API."
source = "21 CFR 11.10(f), (g); design approved 2026-10-07"
status = "implemented"

[[requirement]]
id = "URS-CMP-022"
module = 48
title = "The approval workflows are declared in code and applied on every site; on a site they cannot be changed, switched off, deleted or replaced by another workflow, and every setting is restored on each migrate."
source = "Configuration as code; ISO 13485 4.1.6; strengthened after the robustness review of 2026-10-07"
status = "implemented"

[[requirement]]
id = "URS-CMP-032"
module = 48
title = "While a record awaits approval only its approver can change it, and a record's approval state always matches whether it is submitted, so it never shows as approved without having been approved."
source = "D1 Internal Price Approval, Purchase Approval; 21 CFR 11.10(f); found in the robustness review of 2026-10-07"
status = "implemented"

[[requirement]]
id = "URS-CMP-033"
module = 48
title = "Once a quotation or purchase order is approved, its items, quantities and prices cannot be changed; a change is made by cancelling and amending it, which needs approval again."
source = "D1 Internal Price Approval, Purchase Approval; decided on the client's instruction of 2026-10-07"
status = "implemented"

# --- Module 54: record retention and archival (D3 Retention & Archival) ----
[[requirement]]
id = "URS-CMP-023"
module = 54
title = "Every regulated record type, the audit trail, the electronic signatures and the login history have a declared retention period of at least ten years with its legal basis, which QA can view in the system."
source = "D3 Retention & Archival; ISO 13485 4.2.5; EU MDR Art. 10(8); 10 years decided on the client's instruction of 2026-10-07"
status = "implemented"

[[requirement]]
id = "URS-CMP-024"
module = 54
title = "Login, logout, failed-login and impersonation records are kept for their retention period instead of being cleared after 90 days."
source = "21 CFR 11.10(d), (e), (g)"
status = "implemented"

[[requirement]]
id = "URS-CMP-025"
module = 54
title = "QA can produce an archive copy of every regulated record changed in a period, each in full with its audit history and electronic signatures, together with the period's login history, in a file that can be read without the system; the records stay in the system."
source = "D3 Retention & Archival; 21 CFR 11.10(b)"
status = "implemented"

[[requirement]]
id = "URS-CMP-026"
module = 54
title = "Every archive carries a fingerprint of the whole file and of every file in it, can be verified at any time so that any changed, removed or added file is detected, and cannot be changed or deleted."
source = "21 CFR 11.10(c); data integrity (ALCOA+)"
status = "implemented"

# --- Module 51: alerts and notifications (D2 Alerts & Notifications) -------
[[requirement]]
id = "URS-CMP-027"
module = 51
title = "Stores and QA are alerted once when a lot with stock remaining is 30 days or less from its expiry date, including a lot received that close to it, and once when it has expired, even after a day the alerts did not run; a changed expiry date is alerted afresh; lots with no stock and disabled lots raise no alert."
source = "D2 Alerts & Notifications; module 51 lot expiry; 30 days decided on the client's instruction of 2026-10-07; exact-date gaps found in the robustness review of 2026-10-07"
status = "implemented"

[[requirement]]
id = "URS-CMP-028"
module = 51
title = "The approver is alerted when a quotation or purchase order is waiting for approval, and the person who raised it is alerted when it is approved or returned for revision."
source = "D1 approval points; module 48 approvals"
status = "implemented"

[[requirement]]
id = "URS-CMP-029"
module = 51
title = "The alerts are declared in code, applied on every site, and cannot be edited on a site."
source = "Configuration as code; ISO 13485 4.1.6"
status = "implemented"

# --- Module 18: inventory by batch ------------------------------------------
[[requirement]]
id = "URS-STK-001"
module = 18
title = "Every lot of material and product can be tracked as a batch on every site."
source = "D2 Inventory by Batch (Lot Control); D3 Batch / Lot Traceability Flow"
status = "implemented"

[[requirement]]
id = "URS-STK-002"
module = 18
title = "When stock is picked or issued, the lot that expires first is taken first."
source = "D3 Putaway in Finished Goods Warehouse (FIFO / FEFO)"
status = "implemented"

[[requirement]]
id = "URS-STK-003"
module = 18
title = "Stock can never go below zero, for any item or lot."
source = "D3 Batch / Lot Traceability Flow; data integrity (ALCOA+)"
status = "implemented"

[[requirement]]
id = "URS-STK-008"
module = 18
title = "A lot whose expiry date has passed is never issued, sent to production, consumed or delivered, from any document, the form or the API; it leaves its store only into the hold, rejected or returns store, by QA's own decision, back to its supplier, or as counted."
source = "D3 Putaway in Finished Goods Warehouse (FIFO / FEFO); master plan section 3 (finished goods carry expiry); ISO 13485 7.5.11 (preservation of product); found 2026-10-11: ERPNext refuses an expired lot on a delivery and some production entries, but a material issue naming it by hand, or a move to another usable store, went through"
status = "implemented"

[[requirement]]
id = "URS-STK-009"
module = 18
title = "When stock goes to production or to a customer, the lot that expires first goes first: a lot is refused while an earlier-expiring Approved lot of the same item that has not expired would still be in the same store after the document, unless the document states its FEFO exception reason, which is kept with it and in its audit trail and listed for QA; moving stock from one store to another is not held to it."
source = "D3 Putaway in Finished Goods Warehouse (FIFO / FEFO); URS-STK-002; found 2026-10-11: a lot named by hand was not held to it; exception with a stated reason decided 2026-10-11 (a customer may ask for one lot)"
status = "implemented"

[[requirement]]
id = "URS-PLT-006"
module = 0
title = "A pilot site can be loaded with fictional demo data that follows the client's process (catheter and urine bag lines with the D3 process steps, quarantine, rejected and hold stores, and one demo user per job), and the demo data can never be loaded on any other site."
source = "Delivery plan Phase 2 (pilot), decided 2026-10-07; D2, D3"
status = "implemented"

[[requirement]]
id = "URS-PLT-012"
module = 0
title = "The lead times of the alerts (lot expiry, supplier certificate expiry, customer licence expiry, document review, change-request action due) and the default effectiveness check of a change are settings QA changes on screen, each within fixed bounds, only under an approved change request that lists the settings; the change is recorded with its request and a new version and applies from the next alert run; until QA changes a value the decided one applies (30, 30, 30, 30, 7 and 90 days)."
source = "User's instruction of 2026-10-11 to keep business parameters adjustable by users; review of hard-coded values (master plan section 21); ISO 13485 4.1.6, 21 CFR 11.10(a): a validated parameter changes under change control; values decided 2026-10-07/08; customer licence expiry added with module 5 (URS-MST-008), 30 days as for supplier certificates, decided 2026-10-11"
status = "implemented"

[[requirement]]
id = "URS-PLT-013"
module = 49
title = "The number of consecutive wrong passwords that locks an account (3 to 10) and how long it stays locked (5 to 1440 minutes) are settings QA changes on screen under an approved change request; login and signing follow them at once and again on every migrate, so a hand edit of the site's settings does not last."
source = "21 CFR 11.300(d); URS-CMP-001; user's instruction of 2026-10-11 (adjustable values); 5 attempts and 15 minutes decided 2026-10-10"
status = "implemented"

[[requirement]]
id = "URS-PLT-007"
module = 0
title = "On the pilot's demo data, the standard flow runs end to end with each step done by its job: enquiry, quotation with price approval and sales order; purchase request, purchase order with approval and goods receipt by batch into quarantine; work order on the line's routing with material issue, operations and a finished lot with its expiry; and delivery of that lot, all recorded in the audit trail."
source = "Delivery plan Phase 2 (pilot), decided 2026-10-07; D1, D2, D3"
status = "implemented"

[[requirement]]
id = "URS-PLT-008"
module = 0
title = "Each job's desk shows only the areas its work uses, every chart, card and link in those areas opens for that job, and opening a record type the job may not use is refused with a plain message naming it."
source = "Least privilege (21 CFR 11.10(d)); found in the live pilot test of 2026-10-07 (report and page permission errors)"
status = "implemented"

[[requirement]]
id = "URS-PLT-009"
module = 0
title = "Signed in as each job, the browser opens every area of that job's desk, and the list and new form of every record type the job may create, with every lookup in those forms, without a refused or failed request, and every such form can be filled in; checked on every change."
source = "Found necessary in the live pilot test of 2026-10-07: the screens each job uses were not tested as that job"
status = "implemented"

# --- Module 30: document control (D2 Document Control; ISO 13485 4.2.4) ----
[[requirement]]
id = "URS-QMS-001"
module = 30
title = "Every controlled document (SOP, work instruction, form, specification, packaging and labelling, quality manual, external document) is registered by QA with a unique number TYPE-DEPARTMENT-### and a process owner, and is issued in numbered revisions, one in progress at a time."
source = "D2 Document Control; ISO 13485 4.2.4; numbering decided on the client's instruction of 2026-10-07"
status = "implemented"

[[requirement]]
id = "URS-QMS-002"
module = 30
title = "A revision is signed by its author, reviewed by someone other than the author and approved by QA, never by its author or its reviewer, each with an electronic signature; the reviewer or QA can return it for changes with a reason, and every revision after the first states what changed."
source = "D2 Review & Approval, Version Control; ISO 13485 4.2.4 a), b); 21 CFR 11.50; approver other than the reviewer decided on the client's instruction of 2026-10-07"
status = "implemented"

[[requirement]]
id = "URS-QMS-003"
module = 30
title = "The document file is fingerprinted when its author signs; approval is refused if the file has changed since, the file cannot then be deleted, made public or replaced, and a revision cannot be changed, submitted or changed after submission except through the signed acts."
source = "ISO 13485 4.2.4; 21 CFR 11.10(a), 11.70"
status = "implemented"

[[requirement]]
id = "URS-QMS-004"
module = 30
title = "An approved revision takes effect on its effective date, never earlier than its approval, and the revision it replaces is superseded automatically; the document then shows its effective revision and its next review date."
source = "ISO 13485 4.2.4 c); review period decided on the client's instruction of 2026-10-07"
status = "implemented"

[[requirement]]
id = "URS-QMS-005"
module = 30
title = "Outside QA, people see only the effective revision of each document, and the drafts they author or review, so superseded and withdrawn revisions are not used by mistake; no document or revision is ever deleted or cancelled."
source = "ISO 13485 4.2.4 d), g), h)"
status = "implemented"

[[requirement]]
id = "URS-QMS-006"
module = 30
title = "QA can withdraw a document with an electronic signature and a reason, once no revision is in progress; the document and its effective revision become obsolete and are kept."
source = "ISO 13485 4.2.4 g), h); 4.2.5"
status = "implemented"


[[requirement]]
id = "URS-QMS-007"
module = 30
title = "Each effective document's process owner and QA are alerted once when its periodic review falls due within 30 days, including a review already overdue or a day the alerts did not run, and again for each new review date."
source = "ISO 13485 4.2.4 b) (review and update documents); 30 days as for lot expiry, decided on the client's instruction of 2026-10-07"
status = "implemented"

[[requirement]]
id = "URS-QMS-008"
module = 30
title = "A revision prints as a controlled copy with its signatures only while it is effective, and otherwise as uncontrolled and not for use; its form says whether it is in use, and offers each signed act only to the person allowed to take it, with no other way to approve it."
source = "ISO 13485 4.2.4 d), g); 21 CFR 11.50(b); design approved 2026-10-07 (document control step C)"
status = "implemented"
# --- Module 36: change control (D2 Change Control; ISO 13485 4.1.4, 7.3.9) ---
# Design approved 2026-10-08. Choices left open by the diagrams were decided under the
# client's instruction of 2026-10-07 to take every open choice: who may raise and approve,
# the 90-day effectiveness check, Major needing Management, withdrawal by the requester.
[[requirement]]
id = "URS-QMS-009"
module = 36
title = "Anyone in a business job can raise a change request, numbered CR-YYYY-####, stating what is to change, why, its type (document, product or BOM, process or routing, equipment, supplier, system) and the records it affects; nothing changes under it until it is approved."
source = "D2 Change Control: Change Request; ISO 13485 4.1.4, 7.3.9; who may raise decided under the client's instruction of 2026-10-07"
status = "implemented"

[[requirement]]
id = "URS-QMS-010"
module = 36
title = "QA assesses every change request before it can be approved, recording its impact on product quality, risk, regulatory notification, validation, training, documents and stock in hand, and classifies it Minor or Major; a change that needs regulatory notification is always Major."
source = "D2 Change Control: Impact Assessment; ISO 13485 7.3.9 (evaluate the effect of changes), 4.1.4; CDSCO MDR 2017 (notification of changes)"
status = "implemented"

[[requirement]]
id = "URS-QMS-011"
module = 36
title = "A Minor change is approved by QA and a Major change by QA and then Management, by two different people, each with an electronic signature, and never by the person who raised it; QA, or Management for a Major change awaiting its approval, can return it to the person who raised it, or reject it, with a signature and a reason."
source = "D2 Change Control: Review & Approval; ISO 13485 7.3.9; 21 CFR 11.50; Management approval of Major changes decided under the client's instruction of 2026-10-07"
status = "implemented"

[[requirement]]
id = "URS-QMS-012"
module = 36
title = "A change is implemented through the actions approved with it, each with an owner, a due date and, where one exists, the record it changes; no action can be done before approval or changed after it, each is done by its owner or QA with a note, and the change is implemented once every action is done."
source = "D2 Change Control: Implementation; ISO 13485 7.3.9, 4.2.5; wording clarified 2026-10-10: an action such as training changes no record"
status = "implemented"

[[requirement]]
id = "URS-QMS-013"
module = 36
title = "A change is closed only once QA has verified its effectiveness with an electronic signature, recording it as effective or not effective with a note, on or after its check date: 90 days after implementation unless QA set another number of days when assessing it."
source = "D2 Change Control: Effectiveness Check, Change History; ISO 13485 7.3.9, 8.5.2; 90 days decided under the client's instruction of 2026-10-07"
status = "implemented"

[[requirement]]
id = "URS-QMS-014"
module = 36
title = "A new revision of a controlled document that has an effective revision can be started only under an approved change request that lists that document; the first revision of a new document needs none, and revisions started before this rule are not affected."
source = "D2 Change Control linked to Document Control; ISO 13485 4.2.4 b), 7.3.9"
status = "implemented"

[[requirement]]
id = "URS-QMS-015"
module = 36
title = "QA is alerted when a change request awaits assessment or approval and Management when a Major change awaits its approval; the person who raised it when it is approved, returned or rejected; each action owner once when their action is due within 7 days or overdue; and QA once when an effectiveness check falls due."
source = "D2 Alerts & Notifications; ISO 13485 7.3.9"
status = "implemented"

[[requirement]]
id = "URS-QMS-016"
module = 36
title = "A change request is never deleted or cancelled: the person who raised it can withdraw it with a reason until it is approved, and withdrawn, rejected and closed requests are kept; QA and Management see every request, others only those they raised or have an action on."
source = "ISO 13485 4.2.5; 21 CFR 11.10(c), (d); withdrawal by the requester decided under the client's instruction of 2026-10-07"
status = "implemented"

# --- Module 39: risk management (ISO 14971:2019) ---------------------------------

[[requirement]]
id = "URS-QMS-017"
module = 39
title = "The risk acceptability policy holds the severity and probability scales and the acceptability of every pair: QA writes it and signs it Reviewed, and Management, another person, signs it Approved; one policy is in force, the next approved one supersedes it, and an approved risk assessment keeps the policy it was scored with."
source = "D2 Risk Management: Risk Evaluation; ISO 14971 4.2, 4.4 d); decided 2026-10-11 (plan D-13): severity 1-5 Negligible to Catastrophic, probability 1-5 Improbable to Frequent, each pair Acceptable, Review (ALARP) or Unacceptable; decided 2026-10-11 (plan D-21): QA reviews and Management approves the policy"
status = "implemented"

[[requirement]]
id = "URS-QMS-018"
module = 39
title = "Each product family has one Risk Management File, recording its finished goods (each in exactly one file), its intended use, its reasonably foreseeable misuse and an effective risk management plan; once the file has an approved risk assessment, these change only through the next approved revision."
source = "D2 Risk Management: Risk Identification; ISO 14971 4.4, 4.5, 5.2; product families are client data, decided 2026-10-11 (plan D-13)"
status = "implemented"

[[requirement]]
id = "URS-QMS-019"
module = 39
title = "Each hazard records its category, sequence of events, hazardous situation and harm, with a severity and a probability before and after control; the system works out each risk's acceptability from the policy in force and nobody types it."
source = "D2 Risk Management: Risk Analysis, Risk Evaluation; ISO 14971 5.4, 5.5, 6"
status = "implemented"

[[requirement]]
id = "URS-QMS-020"
module = 39
title = "Every unacceptable risk has a risk control measure of an ISO 14971 7.1 kind, linked to a real record: an effective controlled document, a specification, an item, a bill of materials or an operation; inherently safe design is a Specification document, an item or a bill of materials, and information for safety is a Packaging and Labelling document; each control's version is pinned when the assessment is approved."
source = "D2 Risk Management: Control Measures; ISO 14971 7.1, 7.2; decided 2026-10-11 (plan Q6): a design element is an effective Specification document, an item or a bill of materials"
status = "implemented"

[[requirement]]
id = "URS-QMS-021"
module = 39
title = "Each control references the records verifying its implementation and its effectiveness, and a hazard a control introduces is analysed as a hazard; every hazard has a residual risk no higher than before control, and a residual risk that is not acceptable needs a justification (as low as reasonably practicable, or benefit-risk)."
source = "ISO 14971 7.2 to 7.6"
status = "implemented"

[[requirement]]
id = "URS-QMS-022"
module = 39
title = "A risk assessment revision is authored, reviewed by another person and approved by QA, a third person, each with an electronic signature; approval checks everything again and is refused while a control's record is no longer in force; the approved revision supersedes the previous one, and nothing is deleted or cancelled."
source = "ISO 13485 4.2.4, 4.2.5; 21 CFR 11.50; ISO 14971 4.5"
status = "implemented"

[[requirement]]
id = "URS-QMS-023"
module = 39
title = "QA authors a Risk Management Report on the approved revision in force and QA, another person, approves it with an electronic signature: the plan implemented, the overall residual risk evaluated as acceptable or justified, and the effective SOPs that collect production and post-production information; a new approved revision makes the report no longer current."
source = "D2 Risk Management: Risk Report; ISO 14971 8, 9, 10.1"
status = "implemented"

[[requirement]]
id = "URS-QMS-024"
module = 39
title = "A change request with an impact on risk must list a Risk Management File before QA assesses it; its approval raises a Risk Review of each file it lists, and it cannot be closed while one is open; a new revision of an approved file needs an approved change request listing it, or an open review."
source = "Plan: real links between modules; ISO 14971 10; ISO 13485 7.3.9"
status = "implemented"

[[requirement]]
id = "URS-QMS-025"
module = 39
title = "A Risk Review is raised once when a control's record gets a new version or is no longer in force (when it is saved, and by a daily check), when the periodic review set in Quality Settings falls due, and, through the interface modules 43 and 35 will call, when a complaint or a CAPA names a covered item; one review is open per file and source; QA closes it with an electronic signature, as no change with a rationale or by approving a new revision; an open review is a reminder."
source = "D2 Risk Management: Risk Review; ISO 14971 10.2, 10.3; periodic review every 12 months and 30 days to answer, set in Quality Settings, decided 2026-10-11; complaint and CAPA triggers are raised by modules 43 and 35"
status = "implemented"

# --- Wave 1: lot status and incoming QC (modules 1, 4, 6, 16, 17) ----------------
# Planned on 2026-10-08 from the Phase 0 gap audit: the diagrams' first quality gate.
# Each becomes `implemented` only with its passing tests. On 2026-10-08 the client
# instructed that the certification details come at the end and that every open choice
# is ours until then, taken on the standard; the choices taken are named in each source
# and are confirmed or changed through change control when those details arrive.

[[requirement]]
id = "URS-STK-004"
module = 17
title = "Every lot carries a status, Quarantine, Approved, Rejected or Hold; a lot received or produced starts in Quarantine, and the status changes only through a signed QA release or disposition, never by editing the lot; stock comes into a lot only on the document that made it, lots moved between stores and returns aside, so more stock, a count gain or opening stock comes in as a new lot."
source = "D2 Quarantine / Approved Stock; D3 QC Approval / Rejection, Putaway in Warehouse (Batch/Location); D4 3.5 Accept / Reject / Hold, 3.3 Internal Batch Creation, 4.6 Batch Creation; ISO 13485 7.5.8, 8.3; 21 CFR 11.50; no stock into an existing lot decided on 2026-10-09 from DFD 3.1-3.6"
status = "implemented"

[[requirement]]
id = "URS-STK-005"
module = 17
title = "No stock of a lot that is not Approved can be issued to production, transferred to an approved store, picked, packed or delivered, through the form or the API; a Quarantine, Hold or Rejected lot moves only into the quarantine, hold, rejected or returns stores, or back to its supplier."
source = "D2 Material Issue (From Approved Stock), Reject / Return To Supplier; D3 Rejected (return flow); D4 4.3 Issue Material, 7.2 Allocate Released Batch; ISO 13485 7.5.8, 8.3"
status = "implemented"

[[requirement]]
id = "URS-STK-006"
module = 17
title = "A lot shows its status, who set it, when and why, and the stock reports show quantities by lot status, so Stores and QA see at any time what is in quarantine, on hold, rejected or approved."
source = "D2 Inventory by Batch (Lot Control); D4 D4 Inventory & Batch Ledger; ISO 13485 7.5.8"
status = "implemented"

[[requirement]]
id = "URS-STK-007"
module = 17
title = "When lot status is installed on a site that already holds stock, every lot is given a status by a migration recorded in the audit trail: lots in the approved and finished goods stores become Approved, every other lot Quarantine."
source = "Engineering rules section 8 (schema changes migrate existing data); ISO 13485 4.2.5; status by store role decided under the client's instruction of 2026-10-08, confirmed against the physical count at cutover"
status = "implemented"

[[requirement]]
id = "URS-QC-001"
module = 16
title = "A goods receipt records, per line, the supplier's lot number and the supplier's certificate (analysis or conformity) as a file attached by Stores; the QC Inspector records its verification against the purchase specification, and incoming inspection cannot start for a lot whose certificate is not verified."
source = "D3 Document Verification (COA / COC / ISO); D4 3.1, 3.2; ISO 13485 7.4.3; verification by QC decided under the client's instruction of 2026-10-08"
status = "implemented"

[[requirement]]
id = "URS-QC-002"
module = 16
title = "Incoming quality control is a Quality Inspection of type Incoming per received lot against the item's inspection template, recorded and submitted by a QC Inspector; the sample size, parameters and limits come from the template, each reading records the instrument used, and the result is Accepted or Rejected."
source = "D2 Incoming QC (IQC); D3 Incoming Quality Inspection (IQC); D4 3.4 IQC Inspection; ISO 13485 7.4.3, 7.6, 8.2.6"
status = "implemented"

[[requirement]]
id = "URS-QC-003"
module = 16
title = "A lot that enters stock other than from a work order (on a goods receipt, or on a material receipt such as opening stock) is released by QA with an electronic signature only once an accepted incoming inspection made on the document that brought it in exists for it: release sets the lot Approved and moves its stock to the approved store in one audited transaction; QA can instead reject it with a signature and a reason, which sets it Rejected, moves the stock to the rejected store and creates the return to the supplier for Purchase; or hold it, which sets it Hold and moves it to the hold store; a held lot is released only after a new accepted inspection and with a reason."
source = "D2 Pass? No: Reject / Return To Supplier, Yes: Put Away; D3 Accepted / Rejected; D4 3.5, 3.6; ISO 13485 7.4.3, 8.3; 21 CFR 11.50; release of a held lot after retest decided under the client's instruction of 2026-10-08; inspection of material-receipt lots, and opening stock loaded as material receipts and inspected (DFD 3.1-3.5), decided on 2026-10-09"
status = "implemented"

[[requirement]]
id = "URS-QC-004"
module = 16
title = "QA and Stores see every lot awaiting inspection and every inspected lot awaiting release, with the days each has waited, and the finished lot of a work order is released for dispatch by the same signed QA release until final QC and batch release (modules 25, 26) replace it."
source = "D2 Quarantine / Approved Stock; D4 3.5; interim scope decided in the Phase 0 gap audit of 2026-10-08"
status = "implemented"

[[requirement]]
id = "URS-PUR-001"
module = 4
title = "Every supplier has an approval status, Approved, Conditional or Not Approved, set by QA with an electronic signature and a reason, with the items it is approved for and the expiry date of its certificate; a purchase order for an item from a supplier not approved for it is refused; goods are received only on a goods receipt, never by a purchase invoice that updates stock, and each line only from a supplier approved for its item at the time of receipt, whatever order it was placed under; a Conditional approval has an expiry date, each purchase order under it needs a reason and its lots are inspected at 100 percent; QA and Purchase are alerted once, 30 days before a supplier certificate expires."
source = "D2 Vendor Master, Supplier; D3 Purchase Order to Vendor; D4 2.5 Vendor Management; ISO 13485 7.4.1; conditional approval rules and the 30-day alert decided under the client's instruction of 2026-10-08; the goods receipt as the only way in, and receipt only from a supplier approved at receipt, decided on 2026-10-09"
status = "implemented"

[[requirement]]
id = "URS-PUR-002"
module = 4
title = "Each supplier is rated by the system for every finished calendar month in which QA decided any of its received lots or any of its order lines fell due: quality is the share of those lots QA released rather than rejected, a hold not counting until the lot is decided; delivery is the share of those lines received in full by their required date on goods receipts; the score weighs them as QA sets in Quality Settings (quality 70 percent until changed), or is the one measure the month holds; each rating lists the lots and lines it counted and the settings it used, and is never changed, cancelled or deleted; it is shown on the supplier; a score below the threshold QA sets (80 until changed) makes the supplier due for re-evaluation and alerts QA and Purchase, and only QA's next signed decision on the supplier closes it; ERPNext's supplier scorecard is not used."
source = "D2 Purchase Management (PO, GRN, Vendor Rating); master plan section 3 (vendor master: rating; used by vendor rating); DFD 2.6 Vendor Management; ISO 13485 7.4.1 (monitoring and re-evaluation of suppliers); decided 2026-10-11: monthly, quality by QA's lot decisions, delivery in full by the required date, weights and threshold QA's under change control, the rating informs QA's signed decision and does not itself stop orders, own record instead of ERPNext's Supplier Scorecard (its quality figures read receipt rejections this process never records, its on-time count treats late receipts as on time, its periods can be cancelled unaudited and its standings block orders outside QA's decision)"
status = "implemented"

[[requirement]]
id = "URS-MST-001"
module = 1
title = "Each of the nine masters (item, bill of materials, routing, operation and work centre, supplier, customer, warehouse, equipment, inspection template) carries a version number and an effective date; a change to the controlled fields of a master in use is made only under an approved change request that lists it, raises the version, and is recorded with the previous values in the audit trail; ERPNext's BOM Update Tool does not replace a bill of materials inside approved ones, a changed bill of materials being a new one under change control."
source = "D2 All masters are version controlled and linked with Document Control; D4 D3 Item / BOM / Routing Master; ISO 13485 4.2.4, 7.3.9; blocking the BOM Update Tool's replace decided on 2026-10-09"
status = "implemented"

[[requirement]]
id = "URS-MST-002"
module = 6
title = "An item's inspection template is a controlled specification that states, for each inspection stage (incoming, in-process, final), the parameters, method, limits and sample size, and a template in use changes only under an approved change request."
source = "D2 Specifications & Tests; D3 Specification; D4 D3; ISO 13485 7.1, 8.2.6"
status = "implemented"

[[requirement]]
id = "URS-MST-003"
module = 1
title = "An item is set up in draft and approved by QA with an electronic signature before it is used; until then every record that puts it to use (a material request, request for quotation, supplier quotation, order, quotation, receipt, stock entry or count, lot, bill of materials, work order, job card, inspection, delivery, invoice, pick list, packing slip, product bundle, alternative or asset) is refused for it, from the desk or the API; the approval is given only by the signed act, a variant is approved on its own, and from approval the item's controlled fields change only under an approved change request."
source = "D2 All masters are version controlled and linked with Document Control; master plan section 3 (masters approved before use); DFD D3 Item / BOM / Routing Master; ISO 13485 4.2.4, 7.5.1; 21 CFR 11.10(g); decided 2026-10-10 under the client's instruction to follow the DFD: each variant approved on its own (GS1, one GTIN per variant); items held before the module approved by QA one by one, never by migration (21 CFR 11.50)"
status = "implemented"

[[requirement]]
id = "URS-MST-004"
module = 1
title = "Every item states its type (raw material, packaging, sub-assembly, finished good, consumable, spare part or equipment) and keeps it once approved; a raw material, packaging item, sub-assembly or finished good is lot-tracked with a shelf life, an expiry date on every lot and its storage condition, and QA cannot approve it otherwise."
source = "D2 Inventory by Batch (Lot Control); DFD 3.3 Internal Batch Creation, D4; master plan section 3 (batch-tracked items cannot be received, issued or sold without a batch); ISO 13485 7.5.8, 7.5.9; item types from the master-data template of 2026-10-09, with Equipment for the items behind assets (decided 2026-10-10)"
status = "implemented"

[[requirement]]
id = "URS-MST-005"
module = 1
title = "A finished good states whether it is supplied sterile, its device class under the Medical Devices Rules 2017 (A, B, C, D, or not a device), its storage condition, its pack sizes (units per box, boxes per carton) and its UDI device identifier, a well-formed GTIN that no other item carries; QA cannot approve a finished good without them."
source = "D2 Labels carry batch, manufacturing date, expiry date, UDI and barcode; DFD 6.2 Label Printing, D3; CDSCO MDR 2017 Chapter VI (labelling) and UDI; 21 CFR 830; device class and storage condition kept on 2026-10-10 as D3 regulatory data; printing them on the label is module 23's requirement, not this one's"
status = "implemented"

[[requirement]]
id = "URS-MST-006"
module = 1
title = "A raw material or packaging item is approved only when incoming inspection is required for it and it has a specification for the incoming stage; a finished good only when it has a specification for the final stage; and an approved item cannot lose them."
source = "DFD 3.4 IQC Inspection, 5.3 Final QC Inspection, D6; D2 Incoming QC (IQC), Final QC Testing; master plan section 3 (inspection required at receipt and at which stages, linked specification); ISO 13485 7.4.3, 8.2.6"
status = "implemented"

[[requirement]]
id = "URS-MST-007"
module = 2
title = "A bill of materials is drafted by Production and approved by QA with an electronic signature, which is its only submit, for the Administrator too; QA approves it only when its product is a QA-approved finished good or sub-assembly, it has at least one component, every component is a QA-approved item with a quantity above zero, and its process-loss allowance is between 0 and 100 percent; the signature binds what was approved (product, quantity, components, operations, process loss), not the costs ERPNext updates; a work order is made only from an approved, active bill of its own product."
source = "DFD D3 Item / BOM / Routing Master, 2.2 MRP, 4.1 Create Production Order; master plan section 3 (BOM: components and quantities per unit, scrap allowance, version; masters approved before use) and tracker step 8 (versioned, e-signed, changed only through change control); ISO 13485 7.5.1, 4.2.3; 21 CFR 11.50, 11.70; decided 2026-10-11 under the client's instruction to follow the DFD"
status = "implemented"

[[requirement]]
id = "URS-MST-008"
module = 5
title = "A customer is sold to only under a licence QA has verified: Sales records each licence of a customer with its type, number, issuing authority, validity dates and a copy; QA verifies or rejects it with an electronic signature and a reason, and withdraws a verified licence with a signature when the authority suspends or cancels it; a sales order, delivery note, or invoice that delivers stock is refused when submitted for a customer that holds no verified licence valid both on the document's date and on the day it is submitted, lines added to a submitted order likewise; a customer with a decided licence or exemption is not renamed or merged; unless QA has decided with an electronic signature and a reason that the customer buys without one (such as a hospital buying for its own use), a decision QA can reverse the same way; Sales and QA are alerted once before a verified licence expires, unless a renewed licence that continues it without a gap is already verified."
source = "DFD D1 Customer Master and 1.x Sales Order (only approved customers); master plan tracker step 9 (customer licences and expiry alerts) and the regulatory table (customer licence check on the sales order, D1 holds the customer's licence); CDSCO MDR 2017 (sale of medical devices to licensed parties); ISO 13485 7.2, 7.5.8; 21 CFR 11.50, 11.70; QA verification, withdrawal, the signed per-customer exemption and the review's findings (stock invoices, backdating, merging, renewals) decided 2026-10-11 under the client's instruction to follow the DFD"
status = "implemented"

[[requirement]]
id = "URS-MST-009"
module = 6
title = "Each specification states how its stage is sampled: a fixed sample size, every unit, or ISO 2859-1 single sampling for normal inspection at an inspection level and an AQL; for ISO 2859-1 the inspection's sample size and its accept and reject numbers follow from the size of the lot inspected, as the system counts it, by the standard's tables and its arrows, and every unit is inspected when the sample would reach the lot; the inspector records the nonconforming units found, the lot is accepted only when they do not exceed the accept number and rejected when they reach the reject number, a reading out of its limits counts as a nonconforming unit, and the sampling plan of a specification in use changes only under an approved change request."
source = "Master plan decision: sample sizes follow ISO 2859-1 single sampling at AQL unless the specification says 100 percent; tracker step 11 (controlled specifications and AQL sampling plans, changed only through change control); DFD D2 IQC, IPQC and final QC sampling; ISO 13485 7.4.3, 8.2.6; ISO 2859-1 Tables 1 and 2-A (identical to ANSI/ASQ Z1.4 and MIL-STD-105E), cross-checked against MIL-STD-105E, MIL-STD-105D, the AQLSchemes package, an ISO 2859-1 chart and an online calculator on 2026-10-11; normal inspection only (switching rules not in scope), decided 2026-10-11"
status = "implemented"

[[requirement]]
id = "URS-MST-010"
module = 8
title = "Each piece of equipment is an asset recording its unique equipment tag, its class (production machine, measuring instrument, test equipment, sterilization equipment or utility), manufacturer, model and serial number, where it is used, whether it affects product quality, and whether it needs calibration, preventive maintenance and qualification with their intervals, a measuring instrument always needing calibration; QA approves it with an electronic signature only when these are complete, and that signature is the only way it becomes approved; an inspection reading names as its instrument only approved equipment that is in service; once approved, what QA approved changes only under an approved change request."
source = "DFD D10 Equipment Master and 9D Equipment Management (D1 equipment master); master plan tracker step 10 (equipment master with the history card), the flowchart's equipment module (equipment master, calibration schedule, maintenance plan) and decision of 10 October 2026 (an Equipment item behind each asset); ISO 13485 6.3, 7.5.1, 7.6; 21 CFR 820.70(g), 820.72; 21 CFR 11.50, 11.70; calibration and maintenance due dates and their blocking are module 38, qualification records module 40; decided 2026-10-11 under the client's instruction to follow the DFD"
status = "implemented"

[[requirement]]
id = "URS-MST-011"
module = 62
title = "Each piece of equipment has a history card that lists, by date, its approval and every change to its record, its movements, its calibrations, preventive maintenance and qualifications as signed (and before module 38 its maintenance logs), its repairs, and the inspections that used it as their instrument, with the number of repairs, the downtime of repairs and maintenance, and the number of calibrations found out of tolerance over the period shown."
source = "DFD 9D Equipment Management (D2 history card, D5 performance tracking); master plan module 62 (equipment history card and performance tracking, beyond module 38); ISO 13485 6.3, 7.6 (records of maintenance and calibration); decided 2026-10-11; history card extended with modules 38 and 40 records on 2026-10-11 (rules section 8)"
status = "implemented"

[[requirement]]
id = "URS-MST-012"
module = 3
title = "Each operation, workstation and routing is approved by QA with an electronic signature before it is used, and that signature is the only way it becomes approved: an operation only when it names its work instruction, an effective controlled document of type Work Instruction, and states whether it carries an in-process check; a workstation only when every piece of equipment at it is approved; a routing only when each of its operations and their workstations is approved; a bill of materials with an unapproved routing, operation or workstation is not submitted, and no work order or job card is made on an unapproved operation or workstation; once approved, what QA approved changes only under an approved change request."
source = "Master plan section 3 (masters are created in draft, reviewed and approved by the responsible role before they can be used in a transaction; Routing holds the operation sequence, the work center, machine and the in-process checks attached to each operation), section 6 (every operation carries its in-process checks), stage 3 (released only when BOM and routing are approved versions); DFD D2 (all masters are version controlled and linked with Document Control) and D3 Item / BOM / Routing Master; user's decision of 2026-10-11 to follow the requirement rather than use these masters as is; ISO 13485 4.2.4, 7.5.1; 21 CFR 820.70(a), 11.50, 11.70; the in-process check values stay on the item's in-process specification (module 6), enforcing the check at the job card is module 20"
status = "implemented"

[[requirement]]
id = "URS-MST-013"
module = 7
title = "Each store is approved by QA with an electronic signature, once it is a store that holds stock of a company, and that signature is the only way it becomes approved; no stock moves into or out of a store QA has not approved, whatever the document; once approved, what QA approved changes only under an approved change request."
source = "Master plan section 3 (masters are created in draft, reviewed and approved by the responsible role before they can be used in a transaction; Warehouse: raw, quarantine, approved, WIP, finished goods, rejected and returns areas); DFD D4 Inventory & Batch Ledger; user's decision of 2026-10-11 to follow the requirement; ISO 13485 6.4, 7.5.11; 21 CFR 11.50, 11.70; store roles are module 17 (URS-STK-004 to 007), bin locations module 18"
status = "implemented"

[[requirement]]
id = "URS-PLT-010"
module = 0
title = "The pilot's standard flow performs the certificate check, incoming inspection and signed release of every received lot, and the signed release of the finished lot, by the QC Inspector and QA Manager demo users, in place of the stand-in transfer to the approved store, in both the server and the browser journey."
source = "Delivery plan Phase 2 (pilot); Phase 0 gap audit of 2026-10-08; D2, D3"
status = "implemented"

[[requirement]]
id = "URS-PLT-014"
module = 60
title = "Every item the system alerts on as falling due (a lot's expiry, a supplier's certificate, a customer's licence, a document's review, a change action, a change's effectiveness check) is tracked as a reminder from the day it falls within its lead time until its own record shows the work done, which alone completes it, recording when; past its due date it is overdue, and overdue for the days QA sets in Quality Settings (7 until changed) it is escalated once to QA and Management and its responsible person; each job sees the reminders of its jobs and its own, QA and Management all; a reminder is never made, changed or deleted by hand."
source = "DFD 9C Reminders / Next Due (C3 generate, C4 notify, C5 track and escalate, C6 mark completed), D11 Task, Approval & Reminders; master plan section 8 (calibration, maintenance, training, document review, CAPA, certificate, batch and vendor certificate due dates) and section 10 (escalation when overdue); decided 2026-10-11: a system reminder is completed only by the work in its record"
status = "implemented"

[[requirement]]
id = "URS-PLT-015"
module = 60
title = "QA plans recurring activities, each with what is to be done, the responsible job, its first due date, a frequency (weekly, monthly, quarterly, half-yearly or yearly) and how many days before it is raised; the system raises each occurrence within that time and tells the responsible job; an occurrence is overdue and escalated as any reminder; a person of the responsible job, or QA, completes it saying what was done, and the next occurrence follows the calendar from the due date; a plan is never deleted, only made inactive."
source = "DFD 9C Reminders / Next Due (C1 define reminder category, C2 set due date or frequency); master plan section 8; decided 2026-10-11: the next occurrence follows the calendar, not the day the last was done"
status = "implemented"

[[requirement]]
id = "URS-PLT-016"
module = 59
title = "Any business job raises a task, assigning it to a person with a due date and naming its approver, another person; the person assigned says what was done and submits it for approval; the approver approves it with an electronic signature, which closes it, or returns it with a signed reason to be done again; until it is approved, whoever raised it, or QA, may withdraw it saying why; who may change what it is, its result and its status is held to these steps, a task is never deleted or cancelled, an approved task is final, and its due date is tracked by the reminders."
source = "DFD 9B Task and Approval (B1 create, B2 assign, B3 execute, B4 submit for approval, B5 approve or reject, B6 close), D11; master plan section 8; 21 CFR 11.50, 11.70; decided 2026-10-11: approval and return are signed acts and the approver is never the person assigned"
status = "implemented"

[[requirement]]
id = "URS-PLT-017"
module = 59
title = "Each person has one list of everything waiting on them, each line opening its record: their open reminders, the tasks they are to do or approve, the revisions they are to complete, review or approve, the change requests they are to submit, assess or approve, the lots waiting on QC or QA, the masters, supplier decisions and customer licences waiting for QA, and the quotations and purchase orders waiting for their approval; it shows only records the person may open."
source = "DFD 9B Task and Approval across the modules (used by PO approval, document approval, QA release, change control); master plan section 8; decided 2026-10-11: one list read from the records themselves, not a second copy of their state"
status = "implemented"

[[requirement]]
id = "URS-PLT-018"
module = 61
title = "QA keeps the important files repository's categories and sub-groups and, for each, the jobs that read its files and the jobs that upload them, a sub-group naming none taking its group's; files are kept in a category, not in a group, and a category holding files is neither made a group nor deleted; people see and open only the files of the categories their jobs read, QA and the system administrator all, and only the category's uploading jobs or QA add to or archive its files."
source = "DFD 9E Important Files Repository (E1 create category, E2 create sub group, E5 access control, E6 search and retrieve), D9 Documents; master plan section 8 (licences, regulatory submissions, vendor and sterilization certificates, audit reports, any file that is not a controlled SOP); decided 2026-10-11: access by job per category, inherited by sub-groups"
status = "implemented"

[[requirement]]
id = "URS-PLT-019"
module = 61
title = "A file in the repository is a record of its versions: each upload is the next version, a private file fingerprinted as it is added, with who added it, when, what changed (from the second version) and, where it has one, until when it is valid; earlier versions are never changed or removed and their files are evidence that cannot be changed or deleted; a file is never deleted, only archived with a reason, and an archived file does not change; a current version's validity is tracked as a reminder by the category's uploading jobs, the days before it ends set by QA in Quality Settings (60 until changed), until a new version renews it or it is archived."
source = "DFD 9E (E3 upload document, E4 version control); D9; ISO 13485 4.2.4, 4.2.5; 21 CFR 11.10(c), (e); decided 2026-10-11: validity tracked by the reminders (module 60)"
status = "implemented"

[[requirement]]
id = "URS-EQP-001"
module = 38
title = "A calibration records its date and, per point, the nominal value, limits and the values found and left; the system works out what was in tolerance, the result on the values left and, for a pass, the next due date from the interval QA approved on the equipment; it follows an effective procedure when done in-house and names the laboratory, certificate number and certificate when external; it is completed only by its performer's electronic signature (Maintenance or QA), is never deleted, and does not change once completed but by QA's signed impact assessment."
source = "Flowchart Calibration & Maintenance (calibration records); DFD 9D D6; ISO 13485 7.6; 21 CFR 11.50"
status = "implemented"

[[requirement]]
id = "URS-EQP-002"
module = 38
title = "An in-house calibration is refused unless each reference standard it names is approved equipment, is not the instrument calibrated, and was itself in calibration on the day the calibration was done."
source = "ISO 13485 7.6(a) (traceable to measurement standards)"
status = "implemented"

[[requirement]]
id = "URS-EQP-003"
module = 38
title = "A calibration that finds a value out of tolerance lists the submitted inspections that named the instrument and the submitted job cards at its workstation since its last good calibration, alerts QA, and stays open for QA's signed assessment (no product impact, or product action needed), which a reminder tracks until it is signed."
source = "ISO 13485 7.6 (assess the validity of previous results when equipment is found not to conform); decided 2026-10-11"
status = "implemented"

[[requirement]]
id = "URS-EQP-004"
module = 38
title = "Preventive maintenance records its checks, each OK or not, what was done and the downtime; it is satisfactory only when every check is OK, only a satisfactory record sets the next due date, and it is completed only by its performer's electronic signature and never deleted."
source = "DFD 9D D3 maintenance schedule, D4 maintenance execution; flowchart (maintenance plan, maintenance log, downtime tracking); ISO 13485 6.3"
status = "implemented"

[[requirement]]
id = "URS-EQP-005"
module = 38
title = "Equipment that needs calibration, or preventive maintenance, is fit only while its latest completed record passed and its next due date has not passed; equipment never calibrated, or never maintained, is not fit."
source = "ISO 13485 7.6, 6.3; production stage 3"
status = "implemented"

[[requirement]]
id = "URS-EQP-006"
module = 38
title = "Equipment that is not fit, not qualified though it needs qualification, or under an open repair is refused as an inspection's instrument, at every save and submit of a job card at its workstation and every time logged on one, and when a work order on its workstation is submitted."
source = "Production stage 3 (machine must be within calibration and maintenance due); decided 2026-10-11: block, never warn, on every entry path"
status = "implemented"

[[requirement]]
id = "URS-EQP-007"
module = 38
title = "The Equipment Care Schedule shows each approved piece of equipment's next calibration, maintenance and requalification dates, each as in date, due soon, overdue, never done or not needed."
source = "Flowchart (calibration schedule, maintenance plan)"
status = "implemented"

[[requirement]]
id = "URS-EQP-008"
module = 38
title = "Calibration, maintenance and requalification falling due within the days QA sets in Quality Settings, and an open out-of-tolerance assessment, are tracked as reminders that only the records showing the work done complete."
source = "Flowchart (alerts and reminders); DFD 9C"
status = "implemented"

[[requirement]]
id = "URS-EQP-009"
module = 38
title = "ERPNext's own asset maintenance plans and logs are not used: saving one is refused."
source = "Decided 2026-10-11: ERPNext's asset maintenance drops an end-dated task from its schedule after one completion, rewrites completed logs, allows changes after completion, records no as-found or as-left values and is not signed"
status = "implemented"

[[requirement]]
id = "URS-EQP-010"
module = 40
title = "Each installation, operational and performance qualification is recorded against an effective protocol (an SOP or a form) with its tests, each passed or failed, and passes only when every test passes; its performer executes it with an electronic signature, a change after execution needs execution again, and QA, never its performer, approves it with an electronic signature or returns it with a signed reason; it is never deleted."
source = "Flowchart compliance box (Equipment Qualification IQ/OQ/PQ); ISO 13485 7.5.6, 6.3"
status = "implemented"

[[requirement]]
id = "URS-EQP-011"
module = 40
title = "An operational qualification is refused without an approved, passed installation qualification; a performance qualification without an approved, passed operational qualification done on or after it."
source = "ISO 13485 7.5.6"
status = "implemented"

[[requirement]]
id = "URS-EQP-012"
module = 40
title = "Equipment that needs qualification is qualified only while its latest approved IQ, OQ and PQ each passed, were done in that order, and the PQ is within the requalification interval QA approved on the equipment, if one is set."
source = "ISO 13485 7.5.6; decided 2026-10-11: a requalification interval on the equipment, under change control"
status = "implemented"

[[requirement]]
id = "URS-EQP-013"
module = 38
title = "After a completed repair, equipment that needs calibration is not fit until calibrated again and equipment that needs qualification until a PQ is done again; after a move to another place, equipment that needs qualification is not fit until qualified again from the IQ."
source = "ISO 13485 7.6 (safeguarded from adjustments that would invalidate the measurement), 7.5.6 (revalidation after changes); decided 2026-10-11 by the implementer on the client's instruction to decide the open questions (plan, decisions D-11)"
status = "implemented"

[[requirement]]
id = "URS-TRN-001"
module = 37
title = "For each active employee, the system keeps one training record open on each document their job's approved training matrix names, on the revision in effect and on any revision approved to take effect later, opening it when a revision is approved or takes effect, the employee joins or changes job, or the matrix is approved, and closing open records that are no longer needed."
source = "D2 Training (training records, QMS linkage); ISO 13485 6.2; decided 2026-10-11 (plan D-07): records open at approval, due by the effective date"
status = "implemented"

[[requirement]]
id = "URS-TRN-002"
module = 37
title = "A training record is completed only by signatures: the trainee, on their own account, signs Trained, then a named assessor holding the Production Supervisor or QA role, never the trainee, signs Competent or Not Competent; the trainee's signature alone completes it only where the matrix allows reading; QA alone enters paper history, with a private certificate; a record is never cancelled or deleted."
source = "D2 Training; ISO 13485 6.2; 21 CFR 11.10(i), 11.50, 11.100; decided 2026-10-11 (plan D-08, D-09, D-10)"
status = "implemented"

[[requirement]]
id = "URS-TRN-003"
module = 37
title = "A training is valid until the end of the validity its matrix row sets, or indefinitely where it sets none; a refresher record opens when the validity ends within the warning days set in Quality Settings, and open training is a reminder to the trainee, then the assessor, until completed."
source = "D2 Training (expiry alerts); ISO 13485 6.2(e); decided 2026-10-11 (plan D-07, D-12)"
status = "implemented"

[[requirement]]
id = "URS-TRN-004"
module = 37
title = "A job's training matrix takes effect only when QA approves it with an electronic signature, and is changed only by cancelling and amending it, approved again."
source = "ISO 13485 6.2; decided 2026-10-11 (plan D-17)"
status = "implemented"

[[requirement]]
id = "URS-TRN-005"
module = 37
title = "Time is logged on a job card only by an active operator who holds a completed, unexpired Competent training on the revision in effect of the work instruction of the operation they do, on every path that logs time, including saves that skip validation and ERPNext's time-log method."
source = "D2 Production stage 3 (trained operator); ISO 13485 6.2, 7.5.1"
status = "implemented"

[[requirement]]
id = "URS-TRN-006"
module = 37
title = "QA may revoke an employee's competence with an electronic signature and a reason; the employee is then refused for that work and a retraining record opens; a Not Competent assessment opens a retraining record likewise."
source = "ISO 13485 6.2, 8.3; decided 2026-10-11 (plan D-18)"
status = "implemented"
